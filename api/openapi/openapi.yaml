        latest_version:
          oneOf: [{ $ref: "#/components/schemas/PolicyVersionSummary" }, { type: "null" }]
        created_at: { type: string, format: date-time }
    PolicyList:
      type: object
      required: [data, meta]
      example:
        data:
          - id: 3f6c1c52-0d0b-4f0e-9a52-6b0f6a1c7d11
            product_code: KTA_DEMO
            scope: DEFAULT
            version_count: 1
            created_at: "2026-11-21T08:00:00Z"
            latest_version:
              id: 9a8b7c6d-5e4f-4a3b-8c2d-1e0f9a8b7c6d
              policy_id: 3f6c1c52-0d0b-4f0e-9a52-6b0f6a1c7d11
              product_code: KTA_DEMO
              scope: DEFAULT
              version_number: 1
              status: DRAFT
              description: Initial draft of the KTA_DEMO policy.
              based_on_version_id: null
              dictionary_schema_version: 8
              checksum: null
              submitted_by: null
              submitted_at: null
              created_by: 2e4ebb31-3fbc-480f-a602-302b6766efa1
              created_at: "2026-11-21T08:00:00Z"
              updated_at: "2026-11-21T08:00:00Z"
        meta: { page: 1, per_page: 20, total: 1 }
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/PolicyListItem" }
        meta: { $ref: "#/components/schemas/PageMeta" }
    RacRuleCode:
      type: string
      pattern: "^[A-Z][A-Z0-9_]{2,63}$"
      example: RAC_MIN_AGE
    RacAction:
      type: string
      enum: [REJECT, REFER]
      description: What a failed rule does. REJECT is a hard fail that ends the evaluation; REFER is a soft fail that flags manual review and lets scoring continue.
      example: REJECT
    RacRuleInput:
      type: object
      additionalProperties: false
      required: [rule_code, reason_code, action, expression]
      properties:
        rule_code: { $ref: "#/components/schemas/RacRuleCode", description: Unique within the version. }
        reason_code:
          type: string
          pattern: "^[A-Z][A-Z0-9_]{2,63}$"
          example: AGE_BELOW_MINIMUM
          description: Stable machine-readable explanation returned when the rule fails. Required for every rule. Rules may share one.
        action: { $ref: "#/components/schemas/RacAction" }
        expression:
          type: string
          minLength: 1
          maxLength: 500
          example: age_years >= 21
          description: The condition that must hold to pass the rule. One line, boolean, over data dictionary variables.
        description: { type: string, maxLength: 200, description: Optional note for reviewers. }
    RacRulesReplace:
      type: object
      additionalProperties: false
      required: [rules]
      properties:
        rules:
          type: array
          maxItems: 100
          items: { $ref: "#/components/schemas/RacRuleInput" }
    RacRule:
      type: object
      required: [order, rule_code, reason_code, expression, action, description]
      example: { order: 1, rule_code: RAC_MIN_AGE, reason_code: AGE_BELOW_MINIMUM, expression: "age_years >= 21", action: REJECT, description: Applicant must be at least 21 years old. }
      properties:
        order: { type: integer, minimum: 1, description: Evaluation order; unique within the version. }
        rule_code: { $ref: "#/components/schemas/RacRuleCode" }
        reason_code: { type: string, pattern: "^[A-Z][A-Z0-9_]{2,63}$" }
        expression: { type: string, maxLength: 500 }
        action: { $ref: "#/components/schemas/RacAction" }
        description: { type: string, maxLength: 200 }
    RacRuleSet:
      type: object
      required: [policy_version_id, status, dictionary_schema_version, rules, updated_at]
      example:
        policy_version_id: 9a8b7c6d-5e4f-4a3b-8c2d-1e0f9a8b7c6d
        status: DRAFT
        dictionary_schema_version: 8
        updated_at: "2026-11-22T08:00:00Z"
        rules:
          - { order: 1, rule_code: RAC_MIN_AGE, reason_code: AGE_BELOW_MINIMUM, expression: "age_years >= 21", action: REJECT, description: Applicant must be at least 21 years old. }
          - { order: 2, rule_code: RAC_BLACKLIST, reason_code: BLACKLISTED, expression: "is_blacklisted == false", action: REJECT, description: Blacklisted applicants are rejected. }
          - { order: 3, rule_code: RAC_SLIK, reason_code: SLIK_REVIEW_REQUIRED, expression: "slik_max_kol <= 2", action: REFER, description: Worse collectability goes to manual review. }
      properties:
        policy_version_id: { $ref: "#/components/schemas/PolicyVersionId" }
        status: { $ref: "#/components/schemas/PolicyStatus" }
        dictionary_schema_version: { type: integer, minimum: 0, description: The dictionary version the expressions are checked against. }
        updated_at: { type: string, format: date-time }
        rules:
          type: array
          items: { $ref: "#/components/schemas/RacRule" }
    ScoreDecimal:
      type: string
      pattern: "^-?(0|[1-9][0-9]{0,9})(\\.[0-9]{1,2})?$"
      description: Decimal string with at most two decimals (NUMERIC(12,2)); returned with exactly two. May be negative.
      example: "85.00"
    BinBound:
      type: [string, "null"]
      pattern: "^-?(0|[1-9][0-9]{0,17})(\\.[0-9]+)?$"
      description: Decimal string; whole number for an INTEGER variable, at most the variable's scale for DECIMAL. Null or omitted means unbounded on that side.
      example: "25"
    ScorecardBinInput:
      type: object
      additionalProperties: false
      required: [points]
      properties:
        min_value: { $ref: "#/components/schemas/BinBound", description: "Included. Omit or null for no lower limit (first bin only)." }
        max_value: { $ref: "#/components/schemas/BinBound", description: "Excluded. Omit or null for no upper limit (last bin only)." }
        points: { $ref: "#/components/schemas/ScoreDecimal" }
        label: { type: string, maxLength: 100, description: Optional single-line label for reviewers. }
    ScorecardCharacteristicInput:
      type: object
      additionalProperties: false
      required: [characteristic_code, variable, bins]
      properties:
        characteristic_code: { type: string, pattern: "^[a-z][a-z0-9_]{2,63}$", example: age_group, description: Unique within the scorecard. }
        variable: { type: string, example: age_years, description: An INTEGER or DECIMAL data dictionary variable. Several characteristics may use the same one. }
        description: { type: string, maxLength: 200 }
        missing_points:
          oneOf: [{ $ref: "#/components/schemas/ScoreDecimal" }, { type: "null" }]
          description: Points when the variable is absent or null. Only for an optional input variable.
        bins:
          type: array
          minItems: 1
          maxItems: 50
          description: Ascending, edge to edge, covering every valid value of the variable exactly once.
          items: { $ref: "#/components/schemas/ScorecardBinInput" }
    ScorecardReplace:
      type: object
      additionalProperties: false
      required: [base_score, characteristics]
      properties:
        base_score: { $ref: "#/components/schemas/ScoreDecimal" }
        characteristics:
          type: array
          minItems: 1
          maxItems: 20
          items: { $ref: "#/components/schemas/ScorecardCharacteristicInput" }
    ScorecardBin:
      type: object
      required: [order, min_value, max_value, points, label]
      properties:
        order: { type: integer, minimum: 1 }
        min_value: { $ref: "#/components/schemas/BinBound" }
        max_value: { $ref: "#/components/schemas/BinBound" }
        points: { $ref: "#/components/schemas/ScoreDecimal" }
        label: { type: string }
    ScorecardCharacteristic:
      type: object
      required: [order, characteristic_code, variable, description, missing_points, bins]
      properties:
        order: { type: integer, minimum: 1 }
        characteristic_code: { type: string }
        variable: { type: string }
        description: { type: string }
        missing_points:
          oneOf: [{ $ref: "#/components/schemas/ScoreDecimal" }, { type: "null" }]
        bins:
          type: array
          items: { $ref: "#/components/schemas/ScorecardBin" }
    Scorecard:
      type: object
      required: [base_score, score_range, characteristics]
      properties:
        base_score: { $ref: "#/components/schemas/ScoreDecimal" }
        score_range:
          type: object
          required: [min, max]
          description: Lowest and highest total score the scorecard can produce (base score plus the lowest or highest points of every characteristic, including missing_points). Derived, not stored; the decision matrix must cover it.
          properties:
            min: { $ref: "#/components/schemas/ScoreDecimal" }
            max: { $ref: "#/components/schemas/ScoreDecimal" }
        characteristics:
          type: array
          items: { $ref: "#/components/schemas/ScorecardCharacteristic" }
    ScorecardResponse:
      type: object
      required: [policy_version_id, status, dictionary_schema_version, updated_at, scorecard]
      example:
        policy_version_id: 9a8b7c6d-5e4f-4a3b-8c2d-1e0f9a8b7c6d
        status: DRAFT
        dictionary_schema_version: 8
        updated_at: "2026-11-23T08:00:00Z"
        scorecard:
          base_score: "350.00"
          score_range: { min: "420.00", max: "685.00" }
          characteristics:
            - order: 1
              characteristic_code: age_group
              variable: age_years
              description: Applicant age band.
              missing_points: null
              bins:
                - { order: 1, min_value: null, max_value: "25", points: "40.00", label: under 25 }
                - { order: 2, min_value: "25", max_value: "46", points: "85.00", label: 25 to 45 }
                - { order: 3, min_value: "46", max_value: null, points: "60.00", label: 46 and over }
            - order: 2
              characteristic_code: dsr_band
              variable: dsr_ratio
              description: Debt service ratio band (0 to 1 ratio).
              missing_points: null
              bins:
                - { order: 1, min_value: "0", max_value: "0.3", points: "150.00", label: below 0.30 }
                - { order: 2, min_value: "0.3", max_value: "0.5", points: "70.00", label: 0.30 to below 0.50 }
                - { order: 3, min_value: "0.5", max_value: null, points: "0.00", label: 0.50 and over }
            - order: 3
              characteristic_code: employment_tenure
              variable: employment_tenure_months
              description: Months in current employment.
              missing_points: null
              bins:
                - { order: 1, min_value: "0", max_value: "24", points: "30.00", label: under 24 months }
                - { order: 2, min_value: "24", max_value: null, points: "100.00", label: 24 months or more }
      properties:
        policy_version_id: { $ref: "#/components/schemas/PolicyVersionId" }
        status: { $ref: "#/components/schemas/PolicyStatus" }
        dictionary_schema_version: { type: integer, minimum: 0, description: The dictionary version the scorecard is checked against. }
        updated_at: { type: string, format: date-time }
        scorecard:
          oneOf: [{ $ref: "#/components/schemas/Scorecard" }, { type: "null" }]
          description: Null when no scorecard is configured.
    DecisionRequest:
      type: object
      required: [application_id, product_code, applicant]
      additionalProperties: false
      properties:
        application_id:
          type: string
          pattern: "^[A-Za-z0-9][A-Za-z0-9._:-]{0,63}$"
          description: The caller's own reference of the application. Synthetic data only.
          example: LOAN-APP-DEMO-0001
        product_code: { type: string, pattern: "^[A-Z][A-Z0-9_]{2,31}$", example: KTA_DEMO }
        applicant:
          type: object
          maxProperties: 100
          description: |
            The applicant facts, keyed by the INPUT variables of the data dictionary. Integers are
            JSON numbers, decimals are strings, booleans are booleans. Derived variables
            (`dsr_ratio`, `net_disposable_income`) are computed and must not be sent.
          additionalProperties: true
    DecisionResult:
      type: object
      required:
        - application_id
        - product_code
        - policy_version
        - status
        - final_decision
        - risk_grade
        - total_score
        - reason_codes
        - refer_flag
        - derived_features
        - rac_results
        - rac_not_evaluated
        - base_score
        - score_breakdown
        - matrix
      example:
        application_id: LOAN-APP-DEMO-0001
        product_code: KTA_DEMO
        policy_version: { id: 3f0c1d2e-4a5b-4c6d-8e7f-9a0b1c2d3e4f, number: 1, checksum: "9d2f1c0b8a7e6d5c4b3a29181716151413121110fedcba9876543210abcdef01" }
        status: COMPLETED
        final_decision: APPROVE
        risk_grade: A
        total_score: "685.00"
        reason_codes: []
        refer_flag: false
        derived_features:
          - { code: dsr_ratio, value: "0.208333", exact: 5/24, unit: ratio, formula_version: 1, expression: existing_installment / monthly_income }
          - { code: net_disposable_income, value: "9500000.00", exact: "9500000", unit: IDR, formula_version: 1, expression: monthly_income - existing_installment }
        rac_results:
          - { order: 1, rule_code: RAC_MIN_AGE, reason_code: AGE_BELOW_MINIMUM, action: REJECT, passed: true, inputs: [{ variable: age_years, value: "29" }] }
          - { order: 2, rule_code: RAC_BLACKLIST, reason_code: BLACKLISTED, action: REJECT, passed: true, inputs: [{ variable: is_blacklisted, value: "false" }] }
          - { order: 3, rule_code: RAC_SLIK, reason_code: SLIK_REVIEW_REQUIRED, action: REFER, passed: true, inputs: [{ variable: slik_max_kol, value: "1" }] }
        rac_not_evaluated: []
        base_score: "350.00"
        score_breakdown:
          - { characteristic: age_group, variable: age_years, value: "29", missing: false, bin_order: 2, bin: 25 to 45, points: "85.00" }
          - { characteristic: dsr_band, variable: dsr_ratio, value: 5/24, missing: false, bin_order: 1, bin: below 0.30, points: "150.00" }
          - { characteristic: employment_tenure, variable: employment_tenure_months, value: "36", missing: false, bin_order: 2, bin: 24 months or more, points: "100.00" }
        matrix: { row_order: 3, label: 650 to 900, decision: APPROVE }
      properties:
        application_id: { type: string }
        product_code: { type: string }
        policy_version:
          type: object
          description: The exact policy version that decided, so the decision can be replayed against its frozen snapshot.
          required: [id, number, checksum]
          properties:
            id: { type: string, format: uuid }
            number: { type: integer, minimum: 1 }
            checksum: { type: string, pattern: "^[0-9a-f]{64}$", description: SHA-256 of the canonical snapshot. }
        status:
          type: string
          enum: [COMPLETED]
          description: Processing state. A technical failure is an error response, not a status.
        final_decision: { $ref: "#/components/schemas/MatrixDecision" }
        risk_grade:
          type: [string, "null"]
          description: Grade of the matrix row. Null when a hard RAC rule rejected before scoring.
        total_score:
          oneOf: [{ $ref: "#/components/schemas/ScoreDecimal" }, { type: "null" }]
          description: Base score plus the points of the selected bins. Null when not scored.
        reason_codes:
          type: array
          items: { type: string }
          description: Reason codes of the RAC rules that failed, in rule order. The matrix has none, so a matrix decision adds no code.
        refer_flag: { type: boolean, description: True when a soft (REFER) RAC rule failed. }
        derived_features:
          type: array
          description: Values computed by the feature builder, with the formula version so the run can be replayed.
          items:
            type: object
            required: [code, value, exact, unit, formula_version, expression]
            properties:
              code: { type: string }
              value: { type: string, description: "Rounded to the dictionary scale, for display only." }
              exact: { type: string, description: "Lossless value: a whole number or a fraction such as 5/24." }
              unit: { type: string }
              formula_version: { type: integer, minimum: 1 }
              expression: { type: string }
        rac_results:
          type: array
          description: One entry per evaluated rule, in order. After a hard fail the later rules are listed in `rac_not_evaluated`.
          items:
            type: object
            required: [order, rule_code, reason_code, action, passed, inputs]
            properties:
              order: { type: integer, minimum: 1 }
              rule_code: { type: string }
              reason_code: { type: string }
              action: { type: string, enum: [REJECT, REFER], description: What a failure of this rule does. }
              passed: { type: boolean }
              inputs:
                type: array
                description: The variables the rule used and their values as text (exact fractions stay exact, `null` for a null).
                items:
                  type: object
                  required: [variable, value]
                  properties:
                    variable: { type: string }
                    value: { type: string }
        rac_not_evaluated:
          type: array
          items: { type: string }
          description: Rule codes that did not run because an earlier hard rule rejected.
        base_score: { $ref: "#/components/schemas/ScoreDecimal" }
        score_breakdown:
          type: array
          description: One entry per scorecard characteristic. Empty when RAC rejected before scoring.
          items:
            type: object
            required: [characteristic, variable, value, missing, bin_order, bin, points]
            properties:
              characteristic: { type: string }
              variable: { type: string }
              value: { type: string, description: "The value read, as text; `null` when missing." }
              missing: { type: boolean, description: True when the value was null and the characteristic's missing-data points applied. }
              bin_order:
                type: [integer, "null"]
                description: Position of the selected bin; null when missing.
              bin: { type: [string, "null"], description: "Label of the selected bin, when it has one." }
              points: { $ref: "#/components/schemas/ScoreDecimal" }
        matrix:
          description: The decision matrix row that contained the total score. Null when not scored.
          oneOf:
            - type: object
              required: [row_order, label, decision]
              properties:
                row_order: { type: integer, minimum: 1 }
                label: { type: [string, "null"] }
                decision:
                  $ref: "#/components/schemas/MatrixDecision"
            - type: "null"
    MatrixDecision:
      type: string
      enum: [APPROVE, REFER, REJECT]
      example: APPROVE
    ScoreBound:
      oneOf: [{ $ref: "#/components/schemas/ScoreDecimal" }, { type: "null" }]
      description: Total score bound with at most two decimals. Null or omitted means unbounded on that side.
    DecisionMatrixRowInput:
      type: object
      additionalProperties: false
      required: [grade, decision]
      properties:
        min_score: { $ref: "#/components/schemas/ScoreBound", description: "Included. Omit or null for no lower limit (first row only)." }
        max_score: { $ref: "#/components/schemas/ScoreBound", description: "Excluded. Omit or null for no upper limit (last row only)." }
        grade: { type: string, pattern: "^[A-Z][A-Z0-9_]{0,15}$", example: A, description: Risk grade code. Several rows may share a grade. }
        decision: { $ref: "#/components/schemas/MatrixDecision" }
        label: { type: string, maxLength: 100, description: Optional single-line label for reviewers. }
    DecisionMatrixReplace:
      type: object
      additionalProperties: false
      required: [rows]
      properties:
        rows:
          type: array
          minItems: 1
          maxItems: 50
          description: Ascending score order, edge to edge.
          items: { $ref: "#/components/schemas/DecisionMatrixRowInput" }
    DecisionMatrixRow:
      type: object
      required: [order, min_score, max_score, grade, decision, label]
      properties:
        order: { type: integer, minimum: 1 }
        min_score: { $ref: "#/components/schemas/ScoreBound" }
        max_score: { $ref: "#/components/schemas/ScoreBound" }
        grade: { type: string }
        decision: { $ref: "#/components/schemas/MatrixDecision" }
        label: { type: string }
    DecisionMatrixResponse:
      type: object
      required: [policy_version_id, status, dictionary_schema_version, updated_at, score_range, covers_score_range, decision_matrix]
      example:
        policy_version_id: 9a8b7c6d-5e4f-4a3b-8c2d-1e0f9a8b7c6d
        status: DRAFT
        dictionary_schema_version: 8
        updated_at: "2026-11-24T08:00:00Z"
        score_range: { min: "420.00", max: "685.00" }
        covers_score_range: true
        decision_matrix:
          rows:
            - { order: 1, min_score: "0.00", max_score: "500.00", grade: D, decision: REJECT, label: below 500 }
            - { order: 2, min_score: "500.00", max_score: "650.00", grade: B, decision: REFER, label: 500 to below 650 }
            - { order: 3, min_score: "650.00", max_score: "901.00", grade: A, decision: APPROVE, label: 650 to 900 }
      properties:
        policy_version_id: { $ref: "#/components/schemas/PolicyVersionId" }
        status: { $ref: "#/components/schemas/PolicyStatus" }
        dictionary_schema_version: { type: integer, minimum: 0 }
        updated_at: { type: string, format: date-time }
        score_range:
          oneOf:
            - type: object
              required: [min, max]
              properties:
                min: { $ref: "#/components/schemas/ScoreDecimal" }
                max: { $ref: "#/components/schemas/ScoreDecimal" }
            - type: "null"
          description: Lowest and highest total the version's scorecard can produce; null without a scorecard.
        covers_score_range:
          type: [boolean, "null"]
          description: Whether the rows cover score_range; null when there is no scorecard or no matrix.
        decision_matrix:
          oneOf:
            - type: object
              required: [rows]
              properties:
                rows:
                  type: array
                  items: { $ref: "#/components/schemas/DecisionMatrixRow" }
            - type: "null"
          description: Null when no matrix is configured.
    TestOutcome:
      type: string
      enum: [DECISION, INPUT_VALIDATION_ERROR]
      description: DECISION means the input is valid and the policy gives a business decision; INPUT_VALIDATION_ERROR means the input is refused before any rule runs.
      example: DECISION
    TestCaseExpectedInput:
      type: object
      additionalProperties: false
      required: [outcome]
      properties:
        outcome: { $ref: "#/components/schemas/TestOutcome" }
        decision: { $ref: "#/components/schemas/MatrixDecision", description: "Required for DECISION; not allowed otherwise." }
        grade: { type: string, pattern: "^[A-Z][A-Z0-9_]{0,15}$", description: "Optional for DECISION: a grade of the decision matrix." }
        reason_codes:
          type: array
          maxItems: 20
          items: { type: string, pattern: "^[A-Z][A-Z0-9_]{2,63}$" }
          description: "Optional for DECISION: reason codes of the version's RAC rules, as a set."
    TestCaseInput:
      type: object
      additionalProperties: false
      required: [case_code, input, expected]
      properties:
        case_code: { type: string, pattern: "^[A-Z][A-Z0-9_]{2,63}$", example: GOLDEN_HAPPY_PATH, description: Unique within the version. }
        description: { type: string, maxLength: 200 }
        required: { type: boolean, default: true, description: Required cases must pass before submit; at least one is needed. }
        input:
          type: object
          additionalProperties: true
          description: Applicant facts keyed by input variable code; at most 8 KiB as canonical JSON.
        expected: { $ref: "#/components/schemas/TestCaseExpectedInput" }
    TestCasesReplace:
      type: object
      additionalProperties: false
      required: [test_cases]
      properties:
        test_cases:
          type: array
          maxItems: 100
          items: { $ref: "#/components/schemas/TestCaseInput" }
    TestCase:
      type: object
      required: [order, case_code, description, required, input, expected]
      properties:
        order: { type: integer, minimum: 1 }
        case_code: { type: string }
        description: { type: string }
        required: { type: boolean }
        input: { type: object, additionalProperties: true }
        expected:
          type: object
          required: [outcome, decision, grade, reason_codes]
          properties:
            outcome: { $ref: "#/components/schemas/TestOutcome" }
            decision:
              oneOf: [{ $ref: "#/components/schemas/MatrixDecision" }, { type: "null" }]
            grade: { type: [string, "null"] }
            reason_codes: { type: array, items: { type: string } }
    TestCaseSet:
      type: object
      required: [policy_version_id, status, dictionary_schema_version, updated_at, test_cases]
      example:
        policy_version_id: 9a8b7c6d-5e4f-4a3b-8c2d-1e0f9a8b7c6d
        status: DRAFT
        dictionary_schema_version: 8
        updated_at: "2026-11-25T08:00:00Z"
        test_cases:
          - order: 1
            case_code: GOLDEN_HAPPY_PATH
            description: "Example applicant of section 20.4: score 685, grade A."
            required: true
            input: { age_years: 29, employment_tenure_months: 36, existing_installment: "2500000.00", is_blacklisted: false, monthly_income: "12000000.00", slik_max_kol: 1 }
            expected: { outcome: DECISION, decision: APPROVE, grade: A, reason_codes: [] }
          - order: 2
            case_code: GOLDEN_ZERO_INCOME
            description: "monthly_income 0: validation error, never a division by zero."
            required: true
            input: { age_years: 29, employment_tenure_months: 36, existing_installment: "2500000.00", is_blacklisted: false, monthly_income: "0.00", slik_max_kol: 1 }
            expected: { outcome: INPUT_VALIDATION_ERROR, decision: null, grade: null, reason_codes: [] }
      properties:
        policy_version_id: { $ref: "#/components/schemas/PolicyVersionId" }
        status: { $ref: "#/components/schemas/PolicyStatus" }
        dictionary_schema_version: { type: integer, minimum: 0 }
        updated_at: { type: string, format: date-time }
        test_cases:
          type: array
          items: { $ref: "#/components/schemas/TestCase" }
    ValidationReport:
      type: object
      required: [policy_version_id, status, dictionary_schema_version, valid, summary, score_range, issues, golden_tests, pending_checks]
      example:
        policy_version_id: 9a8b7c6d-5e4f-4a3b-8c2d-1e0f9a8b7c6d
        status: DRAFT
        dictionary_schema_version: 8
        valid: false
        summary: { rac_rules: 3, scorecard_characteristics: 3, decision_matrix_rows: 3, test_cases: 0, required_test_cases: 0 }
        score_range: { min: "420.00", max: "685.00" }
        issues:
          - { field: test_cases, issue: no_required_test_cases, message: "a policy needs at least one required test case (SYSTEM_DESIGN.md 9.3)" }
        golden_tests: { executed: 0, passed: 0, failed: 0, results: [] }
        pending_checks:
          - check: golden_test_execution
            reason: "the policy has other validation issues; fix them first, then the test cases are executed"
      properties:
        policy_version_id: { $ref: "#/components/schemas/PolicyVersionId" }
        status: { $ref: "#/components/schemas/PolicyStatus" }
        dictionary_schema_version: { type: integer, minimum: 0 }
        valid: { type: boolean, description: True when every check that exists passed; submit would succeed. }
        summary:
          type: object
          required: [rac_rules, scorecard_characteristics, decision_matrix_rows, test_cases, required_test_cases]
          properties:
            rac_rules: { type: integer, minimum: 0 }
            scorecard_characteristics: { type: integer, minimum: 0 }
            decision_matrix_rows: { type: integer, minimum: 0 }
            test_cases: { type: integer, minimum: 0 }
            required_test_cases: { type: integer, minimum: 0 }
        score_range:
          oneOf:
            - type: object
              required: [min, max]
              properties:
                min: { $ref: "#/components/schemas/ScoreDecimal" }
                max: { $ref: "#/components/schemas/ScoreDecimal" }
            - type: "null"
        issues:
          type: array
          items:
            type: object
            required: [field, issue]
            properties:
              field: { type: string }
              issue: { type: string }
              message: { type: string }
        golden_tests:
          type: object
          description: The execution of the test cases (RF-013). Empty when they did not run (see `pending_checks`).
          required: [executed, passed, failed, results]
          properties:
            executed: { type: integer, minimum: 0 }
            passed: { type: integer, minimum: 0 }
            failed: { type: integer, minimum: 0, description: Required and optional cases that did not give the expected result. }
            results:
              type: array
              items: { $ref: "#/components/schemas/GoldenTestResult" }
        pending_checks:
          type: array
          description: Checks that did not run, with the reason. Empty when everything ran.
          items:
            type: object
            required: [check, reason]
            properties:
              check: { type: string, examples: [golden_test_execution] }
              reason: { type: string }
    GoldenTestResult:
      type: object
      required: [case_code, required, passed, actual, mismatches]
      example:
        case_code: GOLDEN_SLIK_REFER
        required: true
        passed: true
        actual:
          outcome: DECISION
          decision: REFER
          grade: A
          total_score: "685.00"
          reason_codes: [SLIK_REVIEW_REQUIRED]
          message: null
        mismatches: []
      properties:
        case_code: { type: string }
        required: { type: boolean }
        passed: { type: boolean }
        actual:
          type: object
          description: What the case really produced.
          required: [outcome, decision, grade, total_score, reason_codes, message]
          properties:
            outcome:
              type: string
              enum: [DECISION, INPUT_VALIDATION_ERROR, EVALUATION_ERROR, POLICY_CONFIGURATION_ERROR]
            decision:
              oneOf: [{ $ref: "#/components/schemas/MatrixDecision" }, { type: "null" }]
              description: Set when the outcome is DECISION.
            grade:
              type: [string, "null"]
              description: Grade of the matrix row; null when RAC rejected before scoring.
            total_score:
              oneOf: [{ $ref: "#/components/schemas/ScoreDecimal" }, { type: "null" }]
              description: Null when RAC rejected before scoring.
            reason_codes:
              type: array
              items: { type: string }
              description: Reason codes of the RAC rules that failed, in rule order.
            message:
              type: [string, "null"]
              description: The invalid fields or the error, for an outcome other than DECISION.
        mismatches:
          type: array
          description: What differs from the expectation; empty when the case passed.
          items:
            type: object
            required: [field, issue]
            properties:
              field: { type: string, examples: ["test_cases[0].expected.decision"] }
              issue:
                type: string
                enum: [decision_mismatch, grade_mismatch, reason_codes_mismatch, input_rejected, validation_error_not_raised, evaluation_failed]
              message: { type: string }
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              enum:
                - UNAUTHENTICATED
                - INVALID_CREDENTIALS
                - FORBIDDEN
                - INPUT_VALIDATION_ERROR
                - ROUTE_NOT_FOUND
                - PRODUCT_NOT_FOUND
                - PRODUCT_CODE_CONFLICT
                - VARIABLE_NOT_FOUND
                - VARIABLE_CODE_CONFLICT
                - POLICY_NOT_FOUND
                - POLICY_VERSION_NOT_FOUND
                - POLICY_CONFLICT
                - POLICY_VERSION_FROZEN
                - POLICY_VALIDATION_FAILED
                - POLICY_NOT_ACTIVE
                - POLICY_CONFIGURATION_ERROR
                - EVALUATION_ERROR
                - SERVICE_BUSY
                - INTERNAL_ERROR
            message: { type: string }
            details:
              type: array
              items:
                type: object
                required: [field, issue]
                properties:
                  field: { type: string }
                  issue:
                    type: string
                    description: Stable issue code, e.g. required, too_long, invalid_format, invalid_value, invalid_characters, must_be_string, must_be_boolean, must_be_integer, not_allowed, no_changes, exceeds_scale, less_than_min_value, not_allowed_for_type, not_allowed_when_required, must_be_false_for_derived, exceeds_current_version, unknown_product, product_inactive, not_in_policy, must_be_a_non_negative_integer, must_be_array, must_be_object, too_many, duplicate, syntax_error, unsupported_syntax, unknown_variable, type_error, no_characteristics, no_bins, gap, overlap, min_not_less_than_max, does_not_cover_lower_bound, does_not_cover_upper_bound, must_be_integer, out_of_range, variable_not_numeric, variable_always_present, no_rows, does_not_cover_score_range, missing_section, no_required_test_cases, derived_not_allowed, unknown_grade, unknown_reason_code, validation_error_not_raised, not_allowed_for_outcome, invalid_json, too_large.
                  message:
                    type: string
                    description: Explanation in words for issues that need one, for example the position of a syntax error. Absent for most details.
        request_id: { type: string }

  responses:
    Unauthenticated:
      description: Missing, malformed, tampered, or expired token, or the user is disabled.
      headers:
        X-Request-ID: { $ref: "#/components/headers/XRequestID" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
          example:
            error: { code: UNAUTHENTICATED, message: authentication is required }
            request_id: ab37401e16e0bcc7ddf3f61598024191
    Forbidden:
      description: The caller lacks the required permission.
      headers:
        X-Request-ID: { $ref: "#/components/headers/XRequestID" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
          example:
            error: { code: FORBIDDEN, message: you do not have permission to perform this action }
            request_id: 0f9e8d7c6b5a49382716051f2e3d4c5b
    ValidationError:
      description: The request is well-formed HTTP but semantically invalid.
      headers:
        X-Request-ID: { $ref: "#/components/headers/XRequestID" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
          example:
            error:
              code: INPUT_VALIDATION_ERROR
              message: invalid product
              details:
                - { field: code, issue: invalid_format }
                - { field: name, issue: required }
            request_id: 1a2b3c4d5e6f7a8b9c0d1e2f3a4b5c6d
    ProductNotFound:
      description: No product has this code.
      headers:
        X-Request-ID: { $ref: "#/components/headers/XRequestID" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
          example:
            error: { code: PRODUCT_NOT_FOUND, message: product not found }
            request_id: 9c8b7a6f5e4d3c2b1a0f9e8d7c6b5a49
    VariableNotFound:
      description: No variable has this code.
      headers:
        X-Request-ID: { $ref: "#/components/headers/XRequestID" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
          example:
            error: { code: VARIABLE_NOT_FOUND, message: variable not found }
            request_id: 7a6b5c4d3e2f1a0b9c8d7e6f5a4b3c2d
    PolicyNotFound:
      description: No policy has this id.
      headers:
        X-Request-ID: { $ref: "#/components/headers/XRequestID" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
          example:
            error: { code: POLICY_NOT_FOUND, message: policy not found }
            request_id: 8b7a6c5d4e3f2a1b0c9d8e7f6a5b4c3d
    PolicyVersionNotFound:
      description: No policy version has this id.
      headers:
        X-Request-ID: { $ref: "#/components/headers/XRequestID" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
          example:
            error: { code: POLICY_VERSION_NOT_FOUND, message: policy version not found }
            request_id: 9c8b7a6d5e4f3a2b1c0d9e8f7a6b5c4d
    PolicyVersionFrozen:
      description: The version is not a DRAFT, so it can no longer be edited or submitted.
      headers:
        X-Request-ID: { $ref: "#/components/headers/XRequestID" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
          example:
            error: { code: POLICY_VERSION_FROZEN, message: only a DRAFT version can be changed or submitted }
            request_id: 0d9c8b7a6e5f4a3b2c1d0e9f8a7b6c5d
    PolicyInvalid:
      description: |
        The draft cannot be submitted because its content does not validate, for example a RAC
        expression that no longer compiles against the dictionary version the draft is pinned to.
        The details use the paths of the editing endpoints. The draft stays a DRAFT.
      headers:
        X-Request-ID: { $ref: "#/components/headers/XRequestID" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
          example:
            error:
              code: POLICY_VALIDATION_FAILED
              message: the draft cannot be submitted until its content is valid
              details:
                - { field: "rules[1].expression", issue: unknown_variable, message: "unknown variable \"is_blacklisted\"" }
            request_id: 3c2b1a0d9e8f7a6b5c4d3e2f1a0b9c8d
    InternalError:
      description: Unexpected failure. The cause is logged server-side and never returned.
      headers:
        X-Request-ID: { $ref: "#/components/headers/XRequestID" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
          example:
            error: { code: INTERNAL_ERROR, message: an unexpected error occurred }
            request_id: 5e4d3c2b1a0f9e8d7c6b5a493827160f
    ServiceBusy:
      description: Password hashing capacity is saturated. Retry after the given number of seconds.
      headers:
        X-Request-ID: { $ref: "#/components/headers/XRequestID" }
        Retry-After:
          schema: { type: integer }
          example: 1
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
          example:
            error: { code: SERVICE_BUSY, message: "the service is busy, retry shortly" }
            request_id: 6f5e4d3c2b1a0f9e8d7c6b5a49382716
    RequestTimeout:
      description: The request exceeded the 3 second limit. Produced by the HTTP driver; plain-text body.
      content:
        text/plain:
          schema: { type: string }
          example: Request Timeout
    PayloadTooLarge:
      description: The request body exceeds 64 KiB. Produced by the HTTP driver; plain-text body.
      content:
        text/plain:
          schema: { type: string }
          example: Request Entity Too Large
