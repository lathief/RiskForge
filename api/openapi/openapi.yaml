    RacRuleCode:
      type: string
      pattern: "^[A-Z][A-Z0-9_]{2,63}$"
      example: RAC_MIN_AGE
    RacAction:
      type: string
      enum: [REJECT, REFER]
      description: What a failed rule does. REJECT is a hard fail that ends the evaluation; REFER is a soft fail that flags manual review and lets scoring continue.
      example: REJECT
    RacRuleInput:
      type: object
      additionalProperties: false
      required: [rule_code, reason_code, action, expression]
      properties:
        rule_code: { $ref: "#/components/schemas/RacRuleCode", description: Unique within the version. }
        reason_code:
          type: string
          pattern: "^[A-Z][A-Z0-9_]{2,63}$"
          example: AGE_BELOW_MINIMUM
          description: Stable machine-readable explanation returned when the rule fails. Required for every rule. Rules may share one.
        action: { $ref: "#/components/schemas/RacAction" }
        expression:
          type: string
          minLength: 1
          maxLength: 500
          example: age_years >= 21
          description: The condition that must hold to pass the rule. One line, boolean, over data dictionary variables.
        description: { type: string, maxLength: 200, description: Optional note for reviewers. }
    RacRulesReplace:
      type: object
      additionalProperties: false
      required: [rules]
      properties:
        rules:
          type: array
          maxItems: 100
          items: { $ref: "#/components/schemas/RacRuleInput" }
    RacRule:
      type: object
      required: [order, rule_code, reason_code, expression, action, description]
      example: { order: 1, rule_code: RAC_MIN_AGE, reason_code: AGE_BELOW_MINIMUM, expression: "age_years >= 21", action: REJECT, description: Applicant must be at least 21 years old. }
      properties:
        order: { type: integer, minimum: 1, description: Evaluation order; unique within the version. }
        rule_code: { $ref: "#/components/schemas/RacRuleCode" }
        reason_code: { type: string, pattern: "^[A-Z][A-Z0-9_]{2,63}$" }
        expression: { type: string, maxLength: 500 }
        action: { $ref: "#/components/schemas/RacAction" }
        description: { type: string, maxLength: 200 }
    RacRuleSet:
      type: object
      required: [policy_version_id, status, dictionary_schema_version, rules, updated_at]
      example:
        policy_version_id: 9a8b7c6d-5e4f-4a3b-8c2d-1e0f9a8b7c6d
        status: DRAFT
        dictionary_schema_version: 8
        updated_at: "2026-11-22T08:00:00Z"
        rules:
          - { order: 1, rule_code: RAC_MIN_AGE, reason_code: AGE_BELOW_MINIMUM, expression: "age_years >= 21", action: REJECT, description: Applicant must be at least 21 years old. }
          - { order: 2, rule_code: RAC_BLACKLIST, reason_code: BLACKLISTED, expression: "is_blacklisted == false", action: REJECT, description: Blacklisted applicants are rejected. }
          - { order: 3, rule_code: RAC_SLIK, reason_code: SLIK_REVIEW_REQUIRED, expression: "slik_max_kol <= 2", action: REFER, description: Worse collectability goes to manual review. }
      properties:
        policy_version_id: { $ref: "#/components/schemas/PolicyVersionId" }
        status: { $ref: "#/components/schemas/PolicyStatus" }
        dictionary_schema_version: { type: integer, minimum: 0, description: The dictionary version the expressions are checked against. }
        updated_at: { type: string, format: date-time }
        rules:
          type: array
          items: { $ref: "#/components/schemas/RacRule" }
    ScoreDecimal:
      type: string
      pattern: "^-?(0|[1-9][0-9]{0,9})(\\.[0-9]{1,2})?$"
      description: Decimal string with at most two decimals (NUMERIC(12,2)); returned with exactly two. May be negative.
      example: "85.00"
    BinBound:
      type: [string, "null"]
      pattern: "^-?(0|[1-9][0-9]{0,17})(\\.[0-9]+)?$"
      description: Decimal string; whole number for an INTEGER variable, at most the variable's scale for DECIMAL. Null or omitted means unbounded on that side.
      example: "25"
    ScorecardBinInput:
      type: object
      additionalProperties: false
      required: [points]
      properties:
        min_value: { $ref: "#/components/schemas/BinBound", description: "Included. Omit or null for no lower limit (first bin only)." }
        max_value: { $ref: "#/components/schemas/BinBound", description: "Excluded. Omit or null for no upper limit (last bin only)." }
        points: { $ref: "#/components/schemas/ScoreDecimal" }
        label: { type: string, maxLength: 100, description: Optional single-line label for reviewers. }
    ScorecardCharacteristicInput:
      type: object
      additionalProperties: false
      required: [characteristic_code, variable, bins]
      properties:
        characteristic_code: { type: string, pattern: "^[a-z][a-z0-9_]{2,63}$", example: age_group, description: Unique within the scorecard. }
        variable: { type: string, example: age_years, description: An INTEGER or DECIMAL data dictionary variable. Several characteristics may use the same one. }
        description: { type: string, maxLength: 200 }
        missing_points:
          oneOf: [{ $ref: "#/components/schemas/ScoreDecimal" }, { type: "null" }]
          description: Points when the variable is absent or null. Only for an optional input variable.
        bins:
          type: array
          minItems: 1
          maxItems: 50
          description: Ascending, edge to edge, covering every valid value of the variable exactly once.
          items: { $ref: "#/components/schemas/ScorecardBinInput" }
    ScorecardReplace:
      type: object
      additionalProperties: false
      required: [base_score, characteristics]
      properties:
        base_score: { $ref: "#/components/schemas/ScoreDecimal" }
        characteristics:
          type: array
          minItems: 1
          maxItems: 20
          items: { $ref: "#/components/schemas/ScorecardCharacteristicInput" }
    ScorecardBin:
      type: object
      required: [order, min_value, max_value, points, label]
      properties:
        order: { type: integer, minimum: 1 }
        min_value: { $ref: "#/components/schemas/BinBound" }
        max_value: { $ref: "#/components/schemas/BinBound" }
        points: { $ref: "#/components/schemas/ScoreDecimal" }
        label: { type: string }
    ScorecardCharacteristic:
      type: object
      required: [order, characteristic_code, variable, description, missing_points, bins]
      properties:
        order: { type: integer, minimum: 1 }
        characteristic_code: { type: string }
        variable: { type: string }
        description: { type: string }
        missing_points:
          oneOf: [{ $ref: "#/components/schemas/ScoreDecimal" }, { type: "null" }]
        bins:
          type: array
          items: { $ref: "#/components/schemas/ScorecardBin" }
    Scorecard:
      type: object
      required: [base_score, score_range, characteristics]
      properties:
        base_score: { $ref: "#/components/schemas/ScoreDecimal" }
        score_range:
          type: object
          required: [min, max]
          description: Lowest and highest total score the scorecard can produce (base score plus the lowest or highest points of every characteristic, including missing_points). Derived, not stored; the decision matrix must cover it.
          properties:
            min: { $ref: "#/components/schemas/ScoreDecimal" }
            max: { $ref: "#/components/schemas/ScoreDecimal" }
        characteristics:
          type: array
          items: { $ref: "#/components/schemas/ScorecardCharacteristic" }
    ScorecardResponse:
      type: object
      required: [policy_version_id, status, dictionary_schema_version, updated_at, scorecard]
      example:
        policy_version_id: 9a8b7c6d-5e4f-4a3b-8c2d-1e0f9a8b7c6d
        status: DRAFT
        dictionary_schema_version: 8
        updated_at: "2026-11-23T08:00:00Z"
        scorecard:
          base_score: "350.00"
          score_range: { min: "420.00", max: "685.00" }
          characteristics:
            - order: 1
              characteristic_code: age_group
              variable: age_years
              description: Applicant age band.
              missing_points: null
              bins:
                - { order: 1, min_value: null, max_value: "25", points: "40.00", label: under 25 }
                - { order: 2, min_value: "25", max_value: "46", points: "85.00", label: 25 to 45 }
                - { order: 3, min_value: "46", max_value: null, points: "60.00", label: 46 and over }
            - order: 2
              characteristic_code: dsr_band
              variable: dsr_ratio
              description: Debt service ratio band (0 to 1 ratio).
              missing_points: null
              bins:
                - { order: 1, min_value: "0", max_value: "0.3", points: "150.00", label: below 0.30 }
                - { order: 2, min_value: "0.3", max_value: "0.5", points: "70.00", label: 0.30 to below 0.50 }
                - { order: 3, min_value: "0.5", max_value: null, points: "0.00", label: 0.50 and over }
            - order: 3
              characteristic_code: employment_tenure
              variable: employment_tenure_months
              description: Months in current employment.
              missing_points: null
              bins:
                - { order: 1, min_value: "0", max_value: "24", points: "30.00", label: under 24 months }
                - { order: 2, min_value: "24", max_value: null, points: "100.00", label: 24 months or more }
      properties:
        policy_version_id: { $ref: "#/components/schemas/PolicyVersionId" }
        status: { $ref: "#/components/schemas/PolicyStatus" }
        dictionary_schema_version: { type: integer, minimum: 0, description: The dictionary version the scorecard is checked against. }
        updated_at: { type: string, format: date-time }
        scorecard:
          oneOf: [{ $ref: "#/components/schemas/Scorecard" }, { type: "null" }]
          description: Null when no scorecard is configured.
    DecisionRequest:
      type: object
      required: [application_id, product_code, applicant]
      additionalProperties: false
      properties:
        application_id:
          type: string
          pattern: "^[A-Za-z0-9][A-Za-z0-9._:-]{0,63}$"
          description: The caller's own reference of the application. Synthetic data only.
          example: LOAN-APP-DEMO-0001
        product_code: { type: string, pattern: "^[A-Z][A-Z0-9_]{2,31}$", example: KTA_DEMO }
        applicant:
          type: object
          maxProperties: 100
          description: |
            The applicant facts, keyed by the INPUT variables of the data dictionary. Integers are
            JSON numbers, decimals are strings, booleans are booleans. Derived variables
            (`dsr_ratio`, `net_disposable_income`) are computed and must not be sent.
          additionalProperties: true
    DecisionResult:
      type: object
      required:
        - decision_id
        - created_at
        - application_id
        - product_code
        - policy_version
        - status
        - final_decision
        - risk_grade
        - total_score
        - reason_codes
        - refer_flag
        - derived_features
        - rac_results
        - rac_not_evaluated
        - base_score
        - score_breakdown
        - matrix
      example:
        decision_id: 5d1f0a62-7b3c-4e84-9a15-0c2e6f8b3d47
        created_at: "2026-11-27T09:15:30Z"
        application_id: LOAN-APP-DEMO-0001
        product_code: KTA_DEMO
        policy_version: { id: 3f0c1d2e-4a5b-4c6d-8e7f-9a0b1c2d3e4f, number: 1, checksum: "9d2f1c0b8a7e6d5c4b3a29181716151413121110fedcba9876543210abcdef01" }
        status: COMPLETED
        final_decision: APPROVE
        risk_grade: A
        total_score: "685.00"
        reason_codes: []
        refer_flag: false
        derived_features:
          - { code: dsr_ratio, value: "0.208333", exact: 5/24, unit: ratio, formula_version: 1, expression: existing_installment / monthly_income }
          - { code: net_disposable_income, value: "9500000.00", exact: "9500000", unit: IDR, formula_version: 1, expression: monthly_income - existing_installment }
        rac_results:
          - { order: 1, rule_code: RAC_MIN_AGE, reason_code: AGE_BELOW_MINIMUM, action: REJECT, passed: true, inputs: [{ variable: age_years, value: "29" }] }
          - { order: 2, rule_code: RAC_BLACKLIST, reason_code: BLACKLISTED, action: REJECT, passed: true, inputs: [{ variable: is_blacklisted, value: "false" }] }
          - { order: 3, rule_code: RAC_SLIK, reason_code: SLIK_REVIEW_REQUIRED, action: REFER, passed: true, inputs: [{ variable: slik_max_kol, value: "1" }] }
        rac_not_evaluated: []
        base_score: "350.00"
        score_breakdown:
          - { characteristic: age_group, variable: age_years, value: "29", missing: false, bin_order: 2, bin: 25 to 45, points: "85.00" }
          - { characteristic: dsr_band, variable: dsr_ratio, value: 5/24, missing: false, bin_order: 1, bin: below 0.30, points: "150.00" }
          - { characteristic: employment_tenure, variable: employment_tenure_months, value: "36", missing: false, bin_order: 2, bin: 24 months or more, points: "100.00" }
        matrix: { row_order: 3, label: 650 to 900, decision: APPROVE }
      properties:
        decision_id: { type: string, format: uuid, description: "Identifies the stored decision. Read it with GET /decisions/{decision_id}." }
        created_at: { type: string, format: date-time, description: "When the decision was stored. A replay returns the original time." }
        application_id: { type: string }
        product_code: { type: string }
        policy_version:
          type: object
          description: The exact policy version that decided, so the decision can be replayed against its frozen snapshot.
          required: [id, number, checksum]
          properties:
            id: { type: string, format: uuid }
            number: { type: integer, minimum: 1 }
            checksum: { type: string, pattern: "^[0-9a-f]{64}$", description: SHA-256 of the canonical snapshot. }
        status:
          type: string
          enum: [COMPLETED]
          description: Processing state. A technical failure is an error response, not a status.
        final_decision: { $ref: "#/components/schemas/MatrixDecision" }
        risk_grade:
          type: [string, "null"]
          description: Grade of the matrix row. Null when a hard RAC rule rejected before scoring.
        total_score:
          oneOf: [{ $ref: "#/components/schemas/ScoreDecimal" }, { type: "null" }]
          description: Base score plus the points of the selected bins. Null when not scored.
        reason_codes:
          type: array
          items: { type: string }
          description: Reason codes of the RAC rules that failed, in rule order. The matrix has none, so a matrix decision adds no code.
        refer_flag: { type: boolean, description: True when a soft (REFER) RAC rule failed. }
        derived_features:
          type: array
          description: Values computed by the feature builder, with the formula version so the run can be replayed.
          items:
            type: object
            required: [code, value, exact, unit, formula_version, expression]
            properties:
              code: { type: string }
              value: { type: string, description: "Rounded to the dictionary scale, for display only." }
              exact: { type: string, description: "Lossless value: a whole number or a fraction such as 5/24." }
              unit: { type: string }
              formula_version: { type: integer, minimum: 1 }
              expression: { type: string }
        rac_results:
          type: array
          description: One entry per evaluated rule, in order. After a hard fail the later rules are listed in `rac_not_evaluated`.
          items:
            type: object
            required: [order, rule_code, reason_code, action, passed, inputs]
            properties:
              order: { type: integer, minimum: 1 }
              rule_code: { type: string }
              reason_code: { type: string }
              action: { type: string, enum: [REJECT, REFER], description: What a failure of this rule does. }
              passed: { type: boolean }
              inputs:
                type: array
                description: The variables the rule used and their values as text (exact fractions stay exact, `null` for a null).
                items:
                  type: object
                  required: [variable, value]
                  properties:
                    variable: { type: string }
                    value: { type: string }
        rac_not_evaluated:
          type: array
          items: { type: string }
          description: Rule codes that did not run because an earlier hard rule rejected.
        base_score: { $ref: "#/components/schemas/ScoreDecimal" }
        score_breakdown:
          type: array
          description: One entry per scorecard characteristic. Empty when RAC rejected before scoring.
          items:
            type: object
            required: [characteristic, variable, value, missing, bin_order, bin, points]
            properties:
              characteristic: { type: string }
              variable: { type: string }
              value: { type: string, description: "The value read, as text; `null` when missing." }
              missing: { type: boolean, description: True when the value was null and the characteristic's missing-data points applied. }
              bin_order:
                type: [integer, "null"]
                description: Position of the selected bin; null when missing.
              bin: { type: [string, "null"], description: "Label of the selected bin, when it has one." }
              points: { $ref: "#/components/schemas/ScoreDecimal" }
        matrix:
          description: The decision matrix row that contained the total score. Null when not scored.
          oneOf:
            - type: object
              required: [row_order, label, decision]
              properties:
                row_order: { type: integer, minimum: 1 }
                label: { type: [string, "null"] }
                decision:
                  $ref: "#/components/schemas/MatrixDecision"
            - type: "null"
    ApprovalWorkflowId:
