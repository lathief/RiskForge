openapi: 3.1.0
info:
  title: RiskForge API
  version: 0.12.0
  summary: Credit decision policy platform (synthetic demo data only).
  description: |
    Contract for the endpoints implemented so far (RF-001 to RF-014, plus M1 hardening).

    - All `/api/v1` endpoints except login require `Authorization: Bearer <token>`.
    - Authorization is permission-based. Each operation lists the required permission
      in `x-required-permission`; the role-to-permission matrix lives in
      `app/modules/identity/domain/permission.go`.
    - Every response produced by the application carries an `X-Request-ID` header, and JSON
      error bodies repeat it as `request_id`. `408` and `413` are written by the HTTP driver
      and may not carry it.
    - Semantic validation errors use HTTP 422 consistently.
    - Request bodies are limited to 64 KiB. Requests are limited to 3 seconds.
    - Optional gateway headers `X-App`, `X-Path-Gateway`, `X-Request-From`, `X-Request-User`,
      `X-Device-ID`, and `X-Request-Tags` are recorded in the server's activity log for tracing.
      They never affect authorization; `X-Request-User` is informational only.
    - `408 Request Timeout` and `413 Payload Too Large` are written by the HTTP driver, so
      their body is plain text, not the JSON error envelope. A 408 means the client stopped
      waiting; the handler may still finish server-side, but its database work uses the
      request deadline and is cancelled.
      Unmatched routes (any method) return a JSON `404 ROUTE_NOT_FOUND`.
  license:
    name: MIT
    identifier: MIT
servers:
  - url: /
    description: Same origin as the page (Swagger UI at /swagger)
  - url: http://127.0.0.1:3000
    description: Local Compose environment (rf-dev)

tags:
  - name: Health
    description: Liveness and readiness probes for the container runtime.
  - name: Auth
    description: Login and caller identity.
  - name: Products
    description: Credit product catalog (RF-004).
  - name: Dictionary
    description: Data dictionary of typed input and derived variables, with schema versions (RF-005).
  - name: Policies
    description: Policy packages and their versions, with immutable snapshots on submit (RF-006).
  - name: Decisions
    description: Credit decisions against the active policy (RF-014).

paths:
  /health/live:
    get:
      tags: [Health]
      summary: Process liveness
      operationId: healthLive
      security: []
      responses:
        "200":
          description: The process is running.
          headers:
            X-Request-ID: { $ref: "#/components/headers/XRequestID" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthStatus" }
              example: { status: ok }
        "408": { $ref: "#/components/responses/RequestTimeout" }

  /health/ready:
    get:
      tags: [Health]
      summary: Readiness including database connectivity
      operationId: healthReady
      security: []
      responses:
        "200":
          description: Dependencies are reachable.
          headers:
            X-Request-ID: { $ref: "#/components/headers/XRequestID" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthStatus" }
              example: { status: ok }
        "408": { $ref: "#/components/responses/RequestTimeout" }
        "503":
          description: A dependency is unreachable. The cause is not disclosed.
          headers:
            X-Request-ID: { $ref: "#/components/headers/XRequestID" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthStatus" }
              example: { status: unavailable }

  /api/v1/auth/login:
    post:
      tags: [Auth]
      summary: Exchange username and password for an access token
      description: |
        Unknown user, wrong password, malformed username, and disabled account all return
        the same 401 body. Password checks share a bounded pool (`HASH_MAX_CONCURRENT`);
        when it is saturated the server answers 503 with `Retry-After` instead of queueing.
        The 200 response is sent with `Cache-Control: no-store`.
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
            example: { username: demo_analyst, password: "<DEMO_USER_PASSWORD>" }
      responses:
        "200":
          description: Authenticated.
          headers:
            X-Request-ID: { $ref: "#/components/headers/XRequestID" }
            Cache-Control:
              schema: { type: string, const: no-store }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TokenResponse" }
              example: { access_token: "<access_token>", token_type: Bearer, expires_in: 3600 }
        "401":
          description: Credentials rejected.
          headers:
            X-Request-ID: { $ref: "#/components/headers/XRequestID" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example:
                error: { code: INVALID_CREDENTIALS, message: username or password is incorrect }
                request_id: b9873824497dd1335aa351f4fd5338d0
        "408": { $ref: "#/components/responses/RequestTimeout" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/ServiceBusy" }

  /api/v1/auth/me:
    get:
      tags: [Auth]
      summary: Current caller with effective roles and permissions
      description: Roles are read from the database on every request, so changes apply immediately.
      operationId: me
      responses:
        "200":
          description: The authenticated caller.
          headers:
            X-Request-ID: { $ref: "#/components/headers/XRequestID" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }
              example:
                user_id: 2e4ebb31-3fbc-480f-a602-302b6766efa1
                username: demo_analyst
                roles: [RISK_ANALYST]
                permissions: [product:read, dictionary:read, dictionary:write, policy:read, policy:write, policy:simulate, policy:submit]
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "408": { $ref: "#/components/responses/RequestTimeout" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/products:
    get:
      tags: [Products]
      summary: List products
      operationId: listProducts
      x-required-permission: product:read
      parameters:
        - name: page
          in: query
          schema: { type: integer, minimum: 1, maximum: 10000, default: 1 }
        - name: per_page
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - name: status
          in: query
          schema: { $ref: "#/components/schemas/ProductStatus" }
      responses:
        "200":
          description: One page of products ordered by code. A page past the end returns an empty `data` array.
          headers:
            X-Request-ID: { $ref: "#/components/headers/XRequestID" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProductList" }
              example:
                data:
                  - id: 7d3f0c2e-4b1a-4a8e-9f3d-2c1b0a9e8d7f
                    code: KTA_DEMO
                    name: Kredit Tanpa Agunan (Demo)
                    description: Synthetic unsecured personal loan product for the RiskForge demo.
                    status: ACTIVE
                    created_at: "2026-11-17T08:00:00Z"
                    updated_at: "2026-11-17T08:00:00Z"
                meta: { page: 1, per_page: 20, total: 1 }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "408": { $ref: "#/components/responses/RequestTimeout" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "500": { $ref: "#/components/responses/InternalError" }
    post:
      tags: [Products]
      summary: Create a product
      operationId: createProduct
      x-required-permission: product:write
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProductCreate" }
            example: { code: KPR_DEMO, name: KPR Demo, description: Synthetic mortgage product }
      responses:
        "201":
          description: Created.
          headers:
            X-Request-ID: { $ref: "#/components/headers/XRequestID" }
            Location:
              schema: { type: string }
              example: /api/v1/products/KPR_DEMO
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Product" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "408": { $ref: "#/components/responses/RequestTimeout" }
        "409":
          description: The code is already used.
          headers:
            X-Request-ID: { $ref: "#/components/headers/XRequestID" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example:
                error: { code: PRODUCT_CODE_CONFLICT, message: a product with this code already exists }
                request_id: 4f1c2d3e4a5b6c7d8e9f0a1b2c3d4e5f
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/products/{code}:
    parameters:
      - name: code
        in: path
        required: true
        schema: { $ref: "#/components/schemas/ProductCode" }
    get:
      tags: [Products]
      summary: Get a product by code
      operationId: getProduct
      x-required-permission: product:read
      responses:
        "200":
          description: The product.
          headers:
            X-Request-ID: { $ref: "#/components/headers/XRequestID" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Product" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/ProductNotFound" }
        "408": { $ref: "#/components/responses/RequestTimeout" }
        "500": { $ref: "#/components/responses/InternalError" }
    patch:
      tags: [Products]
      summary: Update name, description, or status
      description: |
        Partial update; omitted fields are unchanged and an empty string clears the description.
        `code` is immutable and sending it is a 422. Products are never deleted; set
        `status` to `INACTIVE` instead.
      operationId: updateProduct
      x-required-permission: product:write
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProductUpdate" }
            example: { status: INACTIVE }
      responses:
        "200":
          description: The updated product.
          headers:
            X-Request-ID: { $ref: "#/components/headers/XRequestID" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Product" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/ProductNotFound" }
        "408": { $ref: "#/components/responses/RequestTimeout" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "500": { $ref: "#/components/responses/InternalError" }
  /api/v1/dictionary/variables:
    get:
      tags: [Dictionary]
      summary: List data dictionary variables
      description: |
        Returns the latest definition of every variable, ordered by `code`. `meta.schema_version`
        is the dictionary schema version the page was read at. Pass `schema_version` to read
        the dictionary as it was at an earlier version (history is append-only, so the answer
        for a given version never changes).
      operationId: listVariables
      x-required-permission: dictionary:read
      parameters:
        - name: page
          in: query
          schema: { type: integer, minimum: 1, maximum: 10000, default: 1 }
        - name: per_page
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - name: origin
          in: query
          schema: { $ref: "#/components/schemas/VariableOrigin" }
        - name: schema_version
          in: query
          description: Read the dictionary as of this schema version. 0 is the empty dictionary; a version newer than the current one is a 422.
          schema: { type: integer, minimum: 0, example: 8 }
      responses:
        "200":
          description: One page of variables. A page past the end returns an empty `data` array.
          headers:
            X-Request-ID: { $ref: "#/components/headers/XRequestID" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VariableList" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "408": { $ref: "#/components/responses/RequestTimeout" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "500": { $ref: "#/components/responses/InternalError" }
    post:
      tags: [Dictionary]
      summary: Define a variable
      description: |
        Creates version 1 of the variable and advances the dictionary schema version by one.
        `code`, `origin`, and `type` can never change afterwards.
        Defaults: `origin` INPUT; `required` true for INPUT and false for DERIVED; `nullable` false;
        `scale` 2 for DECIMAL. Amounts and bounds are decimal strings, never JSON numbers.
        Ranges are sanity limits on the data, not credit policy: eligibility limits belong in RAC rules.
      operationId: createVariable
      x-required-permission: dictionary:write
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VariableCreate" }
            example:
              code: monthly_income
              type: DECIMAL
              description: Verified (synthetic) monthly income. Must be positive.
              unit: IDR
              scale: 2
              min_value: "0.01"
              max_value: "1000000000000.00"
      responses:
        "201":
          description: Created.
          headers:
            X-Request-ID: { $ref: "#/components/headers/XRequestID" }
            Location:
              schema: { type: string }
              example: /api/v1/dictionary/variables/monthly_income
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Variable" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "408": { $ref: "#/components/responses/RequestTimeout" }
        "409":
          description: The code is already used.
          headers:
            X-Request-ID: { $ref: "#/components/headers/XRequestID" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example:
                error: { code: VARIABLE_CODE_CONFLICT, message: a variable with this code already exists }
                request_id: 3b2a1c0d9e8f7a6b5c4d3e2f1a0b9c8d
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "422":
          description: The definition is invalid. Every problem is listed in `details`.
          headers:
            X-Request-ID: { $ref: "#/components/headers/XRequestID" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example:
                error:
                  code: INPUT_VALIDATION_ERROR
                  message: invalid variable
                  details:
                    - { field: code, issue: invalid_format }
                    - { field: max_value, issue: less_than_min_value }
                request_id: 1a2b3c4d5e6f7a8b9c0d1e2f3a4b5c6d
        "500": { $ref: "#/components/responses/InternalError" }
  /api/v1/dictionary/variables/{variable_code}:
    parameters:
      - name: variable_code
        in: path
        required: true
        schema: { $ref: "#/components/schemas/VariableCode" }
    get:
      tags: [Dictionary]
      summary: Get the latest definition of a variable
      operationId: getVariable
      x-required-permission: dictionary:read
      responses:
        "200":
          description: The variable at its latest version.
          headers:
            X-Request-ID: { $ref: "#/components/headers/XRequestID" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Variable" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/VariableNotFound" }
        "408": { $ref: "#/components/responses/RequestTimeout" }
        "500": { $ref: "#/components/responses/InternalError" }
    patch:
      tags: [Dictionary]
      summary: Record a new version of a variable
      description: |
        Partial update. Omitted fields are unchanged, `null` clears `min_value` or `max_value`,
        and an empty `unit` clears the unit. A change that alters something creates the next
        version and advances the dictionary schema version; earlier versions stay readable via
        `schema_version` on the list. Sending only values the variable already has changes
        nothing: the response is the current version with no new version.
        `code`, `origin`, and `type` are immutable and sending them is a 422. Variables are never deleted.
      operationId: updateVariable
      x-required-permission: dictionary:write
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VariableUpdate" }
            example: { max_value: "2000000000000.00" }
      responses:
        "200":
          description: The variable at its latest version (new, or unchanged when nothing differed).
          headers:
            X-Request-ID: { $ref: "#/components/headers/XRequestID" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Variable" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/VariableNotFound" }
        "408": { $ref: "#/components/responses/RequestTimeout" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "500": { $ref: "#/components/responses/InternalError" }
  /api/v1/policies:
    get:
      tags: [Policies]
      summary: List policies
      description: |
        A policy is the package of versions for one product and scope. Each item shows its newest
        version. Ordered by product code and scope.
      operationId: listPolicies
      x-required-permission: policy:read
      parameters:
        - name: page
          in: query
          schema: { type: integer, minimum: 1, maximum: 10000, default: 1 }
        - name: per_page
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - name: product_code
          in: query
          description: Only policies of this product code.
          schema: { type: string, maxLength: 32, example: KTA_DEMO }
      responses:
        "200":
          description: One page of policies. A page past the end returns an empty `data` array.
          headers:
            X-Request-ID: { $ref: "#/components/headers/XRequestID" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PolicyList" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "408": { $ref: "#/components/responses/RequestTimeout" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "500": { $ref: "#/components/responses/InternalError" }
    post:
      tags: [Policies]
      summary: Open a policy for a product
      description: |
        Creates the policy for a product and scope together with its first draft (version 1).
        The draft is written against the current data dictionary schema version. A product and
        scope can have only one policy; to get another draft use `POST /policies/{policy_id}/clone`.
        The product must exist and be ACTIVE. `scope` defaults to `DEFAULT`.
      operationId: createPolicy
      x-required-permission: policy:write
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PolicyCreate" }
            example: { product_code: KTA_DEMO, scope: DEFAULT, description: Initial draft of the KTA_DEMO policy. }
      responses:
        "201":
          description: Created.
          headers:
            X-Request-ID: { $ref: "#/components/headers/XRequestID" }
            Location:
              schema: { type: string }
              example: /api/v1/policies/3f6c1c52-0d0b-4f0e-9a52-6b0f6a1c7d11
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PolicyDetail" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "408": { $ref: "#/components/responses/RequestTimeout" }
        "409":
          description: The product and scope already have a policy.
          headers:
            X-Request-ID: { $ref: "#/components/headers/XRequestID" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example:
                error: { code: POLICY_CONFLICT, message: "a policy already exists for this product and scope; clone it to create a new draft" }
                request_id: 4c3b2a1d0e9f8a7b6c5d4e3f2a1b0c9d
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "500": { $ref: "#/components/responses/InternalError" }
  /api/v1/policies/{policy_id}:
    parameters:
      - name: policy_id
        in: path
        required: true
        schema: { $ref: "#/components/schemas/PolicyId" }
    get:
      tags: [Policies]
      summary: Get a policy with all of its versions
      description: Versions are listed newest first, without their snapshots. Use `GET /policy-versions/{version_id}` for one version with its snapshot.
      operationId: getPolicy
      x-required-permission: policy:read
      responses:
        "200":
          description: The policy.
          headers:
            X-Request-ID: { $ref: "#/components/headers/XRequestID" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PolicyDetail" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/PolicyNotFound" }
        "408": { $ref: "#/components/responses/RequestTimeout" }
        "500": { $ref: "#/components/responses/InternalError" }
  /api/v1/policies/{policy_id}/clone:
    parameters:
      - name: policy_id
        in: path
        required: true
        schema: { $ref: "#/components/schemas/PolicyId" }
    post:
      tags: [Policies]
      summary: Clone a version into a new draft
      description: |
        Creates the next numbered draft as a copy of an existing version of this policy, whatever
        its status. This is also how a rejected version is revised. The body may be omitted.
        Without `source_version_id` the ACTIVE version is copied, or the newest version when none
        is active. The change note is inherited unless `description` is given. The new draft is
        written against the current data dictionary schema version. Content sections
        (RAC, scorecard, decision matrix) are copied once they exist (RF-007 to RF-009).
      operationId: clonePolicy
      x-required-permission: policy:write
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PolicyClone" }
            example: { description: Tighten the DSR threshold. }
      responses:
        "201":
          description: The new draft.
          headers:
            X-Request-ID: { $ref: "#/components/headers/XRequestID" }
            Location:
              schema: { type: string }
              example: /api/v1/policy-versions/9a8b7c6d-5e4f-4a3b-8c2d-1e0f9a8b7c6d
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PolicyVersion" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/PolicyNotFound" }
        "408": { $ref: "#/components/responses/RequestTimeout" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "500": { $ref: "#/components/responses/InternalError" }
  /api/v1/policy-versions/{version_id}:
    parameters:
      - name: version_id
        in: path
        required: true
        schema: { $ref: "#/components/schemas/PolicyVersionId" }
    get:
      tags: [Policies]
      summary: Get one policy version
      description: A frozen version includes its canonical `snapshot` and `checksum`; for a draft both are null.
      operationId: getPolicyVersion
      x-required-permission: policy:read
      responses:
        "200":
          description: The version.
          headers:
            X-Request-ID: { $ref: "#/components/headers/XRequestID" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PolicyVersion" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/PolicyVersionNotFound" }
        "408": { $ref: "#/components/responses/RequestTimeout" }
        "500": { $ref: "#/components/responses/InternalError" }
    patch:
      tags: [Policies]
      summary: Edit a draft
      description: |
        Changes the change note or repoints the draft at another dictionary schema version
        (0 up to the current one). Only a DRAFT can change: any other status is a 409
        `POLICY_VERSION_FROZEN`. A request that changes nothing returns the draft unchanged.
      operationId: updatePolicyVersion
      x-required-permission: policy:write
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PolicyVersionUpdate" }
            example: { description: Raise the minimum income. }
      responses:
        "200":
          description: The draft after the change.
          headers:
            X-Request-ID: { $ref: "#/components/headers/XRequestID" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PolicyVersion" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/PolicyVersionNotFound" }
        "408": { $ref: "#/components/responses/RequestTimeout" }
        "409": { $ref: "#/components/responses/PolicyVersionFrozen" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "500": { $ref: "#/components/responses/InternalError" }
  /api/v1/policy-versions/{version_id}/submit:
    parameters:
      - name: version_id
        in: path
        required: true
        schema: { $ref: "#/components/schemas/PolicyVersionId" }
    post:
      tags: [Policies]
      summary: Freeze a draft for approval
      description: |
        Captures the canonical snapshot of the draft, including the data dictionary definitions
        it was written against, stores its SHA-256 checksum, and moves the version to
        `PENDING_APPROVAL`. After this nothing about the version changes: edits and a second
        submit are 409 `POLICY_VERSION_FROZEN`. No request body.
        Before freezing, the full policy validation of `POST .../validate` runs (SYSTEM_DESIGN.md
        9.3): completeness (a scorecard, a decision matrix, and at least one required test case),
        the RAC rules, the scorecard, the decision matrix against the scorecard range, and the test
        cases, all against the dictionary version the draft is pinned to. If any check fails, the
        answer is a 422 `POLICY_VALIDATION_FAILED` listing every problem (paths start with
        `scorecard.` or `decision_matrix.` for those sections) and the draft stays a DRAFT.
        When those checks pass, every test case is also **executed** through the decision
        pipeline (RF-013): a required case whose decision, grade (when it names one), or reason
        codes differ from the actual result is a validation issue
        (`decision_mismatch`, `grade_mismatch`, `reason_codes_mismatch`, `input_rejected`,
        `validation_error_not_raised`, `evaluation_failed`) and the submit is refused. Optional
        cases that fail do not block. Approving or rejecting a pending version arrives with M4.
      operationId: submitPolicyVersion
      x-required-permission: policy:submit
      responses:
        "200":
          description: The frozen version with its snapshot and checksum.
          headers:
            X-Request-ID: { $ref: "#/components/headers/XRequestID" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PolicyVersion" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/PolicyVersionNotFound" }
        "408": { $ref: "#/components/responses/RequestTimeout" }
        "409": { $ref: "#/components/responses/PolicyVersionFrozen" }
        "422": { $ref: "#/components/responses/PolicyInvalid" }
        "500": { $ref: "#/components/responses/InternalError" }
  /api/v1/policy-versions/{version_id}/rac-rules:
    parameters:
      - name: version_id
        in: path
        required: true
        schema: { $ref: "#/components/schemas/PolicyVersionId" }
    get:
      tags: [Policies]
      summary: List the RAC rules of a version
      description: Rules in evaluation order (`order` 1, 2, 3, ...). Works for any status; a frozen version returns the rules it was frozen with.
      operationId: getRacRules
      x-required-permission: policy:read
      responses:
        "200":
          description: The rules, possibly none.
          headers:
            X-Request-ID: { $ref: "#/components/headers/XRequestID" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RacRuleSet" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/PolicyVersionNotFound" }
        "408": { $ref: "#/components/responses/RequestTimeout" }
        "500": { $ref: "#/components/responses/InternalError" }
    put:
      tags: [Policies]
      summary: Replace the RAC rules of a draft
      description: |
        Replaces the whole list in one step. The position in `rules` is the evaluation order, so
        reordering is a PUT with the same rules in another order. An empty list removes all rules.
        Nothing is stored unless every rule is valid, and every problem is reported together with
        its path (`rules[2].expression`). Sending the list the draft already has changes nothing.

        An `expression` is the condition an applicant must satisfy to **pass** the rule, written
        in the `expr` language limited to: comparisons (`== != < <= > >=`), `and`/`or`/`not`
        (also `&& || !`), arithmetic (`+ - * / %`), `in` / `not in` with a list of numbers or
        booleans, number and boolean literals, `nil`, parentheses, and the names of data dictionary
        variables. Function calls, strings, member access, conditionals, and everything else are
        rejected (`unsupported_syntax`). The expression must be boolean and well typed against the
        dictionary version the draft is pinned to (`dictionary_schema_version`). `action` says what
        a failed rule does: `REJECT` ends the evaluation with a rejection, `REFER` sends the
        application to manual review and scoring continues. Rules are only checked here, not run;
        evaluation arrives with RF-012.

        Issue codes for `expression`: `required`, `too_long`, `invalid_characters`, `syntax_error`,
        `unsupported_syntax`, `unknown_variable`, `type_error`. `message` carries the explanation.
        Only a DRAFT can change: any other status is a 409 `POLICY_VERSION_FROZEN`.
      operationId: replaceRacRules
      x-required-permission: policy:write
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RacRulesReplace" }
            example:
              rules:
                - { rule_code: RAC_MIN_AGE, reason_code: AGE_BELOW_MINIMUM, action: REJECT, expression: "age_years >= 21", description: Applicant must be at least 21 years old. }
                - { rule_code: RAC_BLACKLIST, reason_code: BLACKLISTED, action: REJECT, expression: "is_blacklisted == false", description: Blacklisted applicants are rejected. }
                - { rule_code: RAC_SLIK, reason_code: SLIK_REVIEW_REQUIRED, action: REFER, expression: "slik_max_kol <= 2", description: Worse collectability goes to manual review. }
      responses:
        "200":
          description: The rules as stored.
          headers:
            X-Request-ID: { $ref: "#/components/headers/XRequestID" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RacRuleSet" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/PolicyVersionNotFound" }
        "408": { $ref: "#/components/responses/RequestTimeout" }
        "409": { $ref: "#/components/responses/PolicyVersionFrozen" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "422":
          description: The list is invalid. Nothing was stored.
          headers:
            X-Request-ID: { $ref: "#/components/headers/XRequestID" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example:
                error:
                  code: INPUT_VALIDATION_ERROR
                  message: invalid policy
                  details:
                    - { field: "rules[0].expression", issue: unknown_variable, message: unknown variable "agee_years" }
                    - { field: "rules[1].reason_code", issue: required }
                    - { field: "rules[2].rule_code", issue: duplicate, message: "already used by rules[0]" }
                request_id: 2b1a0c9d8e7f6a5b4c3d2e1f0a9b8c7d
        "500": { $ref: "#/components/responses/InternalError" }
  /api/v1/policy-versions/{version_id}/scorecard:
    parameters:
      - name: version_id
        in: path
        required: true
        schema: { $ref: "#/components/schemas/PolicyVersionId" }
    get:
      tags: [Policies]
      summary: Get the scorecard of a version
      description: |
        The scorecard with its characteristics and bins in order, and the derived `score_range`
        (lowest and highest total score it can produce). `scorecard` is null when none is
        configured. Works for any status; a frozen version returns the scorecard it was frozen with.
      operationId: getScorecard
      x-required-permission: policy:read
      responses:
        "200":
          description: The scorecard, or null.
          headers:
            X-Request-ID: { $ref: "#/components/headers/XRequestID" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ScorecardResponse" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/PolicyVersionNotFound" }
        "408": { $ref: "#/components/responses/RequestTimeout" }
        "500": { $ref: "#/components/responses/InternalError" }
    put:
      tags: [Policies]
      summary: Replace the scorecard of a draft
      description: |
        Replaces the whole scorecard in one step: `total_score = base_score + the points of the one
        bin each characteristic selects` (SYSTEM_DESIGN.md 10.3). Characteristics keep the order
        given, and each one scores one numeric data dictionary variable.

        **Bins are half-open intervals `[min_value, max_value)`**: `min_value` is included,
        `max_value` is not. An omitted or null `min_value` means no lower limit and an omitted or
        null `max_value` means no upper limit. Bins are listed in ascending order and must cover
        every value the variable can have exactly once: the first bin starts at or below the
        variable's dictionary minimum (or has no `min_value`), each bin starts where the previous
        one ends (`gap` / `overlap` otherwise), and the last bin ends above the dictionary maximum
        (or has no `max_value`). So every valid input selects exactly one bin. Bounds follow the
        variable type: whole numbers for INTEGER (`must_be_integer`), at most the variable's scale
        for DECIMAL (`exceeds_scale`). They are returned in shortest form (`"0.30"` becomes `"0.3"`).

        `base_score`, `points`, and `missing_points` are decimal strings with at most two decimals
        (NUMERIC(12,2)); they are returned with exactly two and may be negative. Sums are exact.
        `missing_points` is the explicit outcome when the variable is absent or null, and is only
        allowed for an optional input variable (`variable_always_present` otherwise).

        Everything is checked against the dictionary version the draft is pinned to. Nothing is
        stored unless the whole scorecard is valid; every problem is reported with its path
        (`characteristics[1].bins[2].min_value`). Sending the scorecard the draft already has
        changes nothing. Only a DRAFT can change (409 `POLICY_VERSION_FROZEN`).
      operationId: replaceScorecard
      x-required-permission: policy:write
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ScorecardReplace" }
            example:
              base_score: "350.00"
              characteristics:
                - characteristic_code: age_group
                  variable: age_years
                  bins:
                    - { max_value: "25", points: "40.00", label: under 25 }
                    - { min_value: "25", max_value: "46", points: "85.00", label: 25 to 45 }
                    - { min_value: "46", points: "60.00", label: 46 and over }
                - characteristic_code: dsr_band
                  variable: dsr_ratio
                  bins:
                    - { min_value: "0", max_value: "0.30", points: "150.00" }
                    - { min_value: "0.30", max_value: "0.50", points: "70.00" }
                    - { min_value: "0.50", points: "0.00" }
      responses:
        "200":
          description: The scorecard as stored.
          headers:
            X-Request-ID: { $ref: "#/components/headers/XRequestID" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ScorecardResponse" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/PolicyVersionNotFound" }
        "408": { $ref: "#/components/responses/RequestTimeout" }
        "409": { $ref: "#/components/responses/PolicyVersionFrozen" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "422":
          description: The scorecard is invalid. Nothing was stored.
          headers:
            X-Request-ID: { $ref: "#/components/headers/XRequestID" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example:
                error:
                  code: INPUT_VALIDATION_ERROR
                  message: invalid policy
                  details:
                    - { field: "characteristics[0].bins[1].min_value", issue: gap, message: "values from 25 up to this bin's min_value belong to no bin" }
                    - { field: "characteristics[1].variable", issue: unknown_variable, message: "unknown variable \"salary\"" }
                request_id: 5d4c3b2a1f0e9d8c7b6a5f4e3d2c1b0a
        "500": { $ref: "#/components/responses/InternalError" }
    delete:
      tags: [Policies]
      summary: Remove the scorecard of a draft
      description: Removes the scorecard; `GET` then returns `scorecard` null. Answers 204 also when there was none. Only a DRAFT can change.
      operationId: deleteScorecard
      x-required-permission: policy:write
      responses:
        "204":
          description: Removed (or there was nothing to remove).
          headers:
            X-Request-ID: { $ref: "#/components/headers/XRequestID" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/PolicyVersionNotFound" }
        "408": { $ref: "#/components/responses/RequestTimeout" }
        "409": { $ref: "#/components/responses/PolicyVersionFrozen" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/policy-versions/{version_id}/decision-matrix:
    parameters:
      - name: version_id
        in: path
        required: true
        schema: { $ref: "#/components/schemas/PolicyVersionId" }
    get:
      tags: [Policies]
      summary: Get the decision matrix of a version
      description: |
        The rows in ascending score order. `decision_matrix` is null when none is configured.
        `score_range` is the range of total scores the version's scorecard can produce (null
        without a scorecard), and `covers_score_range` says whether the stored rows still cover it
        (null when there is no scorecard or no matrix); it turns false when the scorecard is
        edited after the matrix. Works for any status.
      operationId: getDecisionMatrix
      x-required-permission: policy:read
      responses:
        "200":
          description: The decision matrix, or null.
          headers:
            X-Request-ID: { $ref: "#/components/headers/XRequestID" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DecisionMatrixResponse" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/PolicyVersionNotFound" }
        "408": { $ref: "#/components/responses/RequestTimeout" }
        "500": { $ref: "#/components/responses/InternalError" }
    put:
      tags: [Policies]
      summary: Replace the decision matrix of a draft
      description: |
        Replaces the whole matrix in one step. Each row maps a total score to a risk `grade` and a
        `decision` (`APPROVE`, `REFER`, or `REJECT`; there is no default) (SYSTEM_DESIGN.md 10.4).

        **Rows are half-open score intervals `[min_score, max_score)`**: `min_score` is included,
        `max_score` is not, the same rule as scorecard bins. An omitted or null `min_score` means no
        lower limit (first row only) and an omitted or null `max_score` no upper limit (last row
        only). Rows are listed in ascending order and each starts where the previous one ends
        (`gap` / `overlap` otherwise). When the draft has a scorecard, the rows must also cover
        every total it can produce (`score_range`): the first row starts at or below its minimum
        and the last ends above its maximum (`does_not_cover_score_range`). So no score of this
        version can ever find no row. Bounds are decimal strings with at most two decimals and are
        returned with exactly two. For the demo score domain 0 to 900 inclusive the last row ends
        at `901`.

        Nothing is stored unless the whole matrix is valid; every problem is reported with its path
        (`rows[1].min_score`). Sending the matrix the draft already has changes nothing. At least
        one row is required; remove a matrix with `DELETE`. Only a DRAFT can change (409
        `POLICY_VERSION_FROZEN`). The matrix is checked, not run: lookup at decision time and the
        precedence of RAC results over the matrix arrive with RF-013.
      operationId: replaceDecisionMatrix
      x-required-permission: policy:write
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DecisionMatrixReplace" }
            example:
              rows:
                - { min_score: "0", max_score: "500", grade: D, decision: REJECT, label: below 500 }
                - { min_score: "500", max_score: "650", grade: B, decision: REFER, label: 500 to below 650 }
                - { min_score: "650", max_score: "901", grade: A, decision: APPROVE, label: 650 to 900 }
      responses:
        "200":
          description: The matrix as stored.
          headers:
            X-Request-ID: { $ref: "#/components/headers/XRequestID" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DecisionMatrixResponse" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/PolicyVersionNotFound" }
        "408": { $ref: "#/components/responses/RequestTimeout" }
        "409": { $ref: "#/components/responses/PolicyVersionFrozen" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "422":
          description: The matrix is invalid. Nothing was stored.
          headers:
            X-Request-ID: { $ref: "#/components/headers/XRequestID" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example:
                error:
                  code: INPUT_VALIDATION_ERROR
                  message: invalid policy
                  details:
                    - { field: "rows[1].min_score", issue: gap, message: "scores from 500.00 up to this row's min_score belong to no row" }
                    - { field: "rows[2].max_score", issue: does_not_cover_score_range, message: "the scorecard can produce scores up to 685.00; max_score is excluded, so the last row must end above it, or have no max_score" }
                request_id: 6e5d4c3b2a1f0e9d8c7b6a5f4e3d2c1b
        "500": { $ref: "#/components/responses/InternalError" }
    delete:
      tags: [Policies]
      summary: Remove the decision matrix of a draft
      description: Removes the matrix; `GET` then returns `decision_matrix` null. Answers 204 also when there was none. Only a DRAFT can change.
      operationId: deleteDecisionMatrix
      x-required-permission: policy:write
      responses:
        "204":
          description: Removed (or there was nothing to remove).
          headers:
            X-Request-ID: { $ref: "#/components/headers/XRequestID" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/PolicyVersionNotFound" }
        "408": { $ref: "#/components/responses/RequestTimeout" }
        "409": { $ref: "#/components/responses/PolicyVersionFrozen" }
        "500": { $ref: "#/components/responses/InternalError" }
  /api/v1/policy-versions/{version_id}/test-cases:
    parameters:
      - name: version_id
        in: path
        required: true
        schema: { $ref: "#/components/schemas/PolicyVersionId" }
    get:
      tags: [Policies]
      summary: List the test cases of a version
      description: The regression ("golden") cases of the version in order (SYSTEM_DESIGN.md 9.1 and 12). Works for any status.
      operationId: getTestCases
      x-required-permission: policy:read
      responses:
        "200":
          description: The test cases, possibly none.
          headers:
            X-Request-ID: { $ref: "#/components/headers/XRequestID" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TestCaseSet" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/PolicyVersionNotFound" }
        "408": { $ref: "#/components/responses/RequestTimeout" }
        "500": { $ref: "#/components/responses/InternalError" }
    put:
      tags: [Policies]
      summary: Replace the test cases of a draft
      description: |
        Replaces the whole list. A test case is an applicant `input` (the same facts the decision
        API will take: integers as JSON numbers, decimals as strings, booleans) and the result the
        policy is expected to give: either a business `DECISION` (with `decision`, optional
        `grade`, and optional `reason_codes`) or an `INPUT_VALIDATION_ERROR`. Cases are `required`
        unless set to false; a version can only be submitted with at least one required case.

        Each case is checked now, against the dictionary version the draft is pinned to and the
        draft's current RAC rules and decision matrix:
        input keys must be input variables of the dictionary (`unknown_variable`,
        `derived_not_allowed`); `grade` must be a grade of the matrix (`unknown_grade`) and every
        reason code a reason code of a RAC rule (`unknown_reason_code`); and the input is **run
        against the data dictionary**: a `DECISION` case needs an input that passes it (the issue
        of the dictionary is reported at `input.<variable>`), and an `INPUT_VALIDATION_ERROR` case
        needs one that fails it (`validation_error_not_raised`). "Fails" includes the preconditions of
        the derived features (RF-011), such as `monthly_income` greater than zero. Whether the
        expected decision, grade, and reason codes are what the policy gives is checked when the
        cases are executed by `POST .../validate` and by submit (RF-013), not when they are saved.

        Reason codes are a set and are returned sorted. Nothing is stored unless every case is
        valid; every problem is reported with its path. Sending the list the draft already has
        changes nothing; an empty list removes all cases. Only a DRAFT can change (409
        `POLICY_VERSION_FROZEN`).
      operationId: replaceTestCases
      x-required-permission: policy:write
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TestCasesReplace" }
            example:
              test_cases:
                - case_code: GOLDEN_HAPPY_PATH
                  description: "Example applicant of section 20.4: score 685, grade A."
                  input: { age_years: 29, monthly_income: "12000000.00", existing_installment: "2500000.00", employment_tenure_months: 36, slik_max_kol: 1, is_blacklisted: false }
                  expected: { outcome: DECISION, decision: APPROVE, grade: A }
                - case_code: GOLDEN_AGE_BELOW_MINIMUM
                  input: { age_years: 19, monthly_income: "12000000.00", existing_installment: "2500000.00", employment_tenure_months: 36, slik_max_kol: 1, is_blacklisted: false }
                  expected: { outcome: DECISION, decision: REJECT, reason_codes: [AGE_BELOW_MINIMUM] }
                - case_code: GOLDEN_ZERO_INCOME
                  input: { age_years: 29, monthly_income: "0.00", existing_installment: "2500000.00", employment_tenure_months: 36, slik_max_kol: 1, is_blacklisted: false }
                  expected: { outcome: INPUT_VALIDATION_ERROR }
      responses:
        "200":
          description: The test cases as stored.
          headers:
            X-Request-ID: { $ref: "#/components/headers/XRequestID" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TestCaseSet" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/PolicyVersionNotFound" }
        "408": { $ref: "#/components/responses/RequestTimeout" }
        "409": { $ref: "#/components/responses/PolicyVersionFrozen" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "422":
          description: The list is invalid. Nothing was stored.
          headers:
            X-Request-ID: { $ref: "#/components/headers/XRequestID" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example:
                error:
                  code: INPUT_VALIDATION_ERROR
                  message: invalid policy
                  details:
                    - { field: "test_cases[0].input.monthly_income", issue: below_min_value, message: "the expected outcome is a decision, so the input must pass the data dictionary" }
                    - { field: "test_cases[1].expected.reason_codes[0]", issue: unknown_reason_code, message: "no RAC rule of this version has reason code \"NOT_A_REASON\"" }
                request_id: 7f6e5d4c3b2a1f0e9d8c7b6a5f4e3d2c
        "500": { $ref: "#/components/responses/InternalError" }
  /api/v1/policy-versions/{version_id}/validate:
    parameters:
      - name: version_id
        in: path
        required: true
        schema: { $ref: "#/components/schemas/PolicyVersionId" }
    post:
      tags: [Policies]
      summary: Validate a whole policy version
      description: |
        Runs the full policy validation of SYSTEM_DESIGN.md 9.3 and returns a report; nothing
        changes. Submit runs the same checks and refuses the version (422
        `POLICY_VALIDATION_FAILED`, same `issues`) when any fails, so this is the dry run of
        submit and needs the same permission. Works for any status; a frozen version is checked
        again against the dictionary version it is pinned to. No request body.

        Checks: **completeness** (a scorecard, a decision matrix, and at least one required test
        case: `missing_section`, `no_required_test_cases`; RAC rules are optional); every **RAC
        expression** compiles and type-checks; the **scorecard** variables exist and are numeric
        and its bins cover each variable exactly once; the **decision matrix** covers the
        scorecard's score range; every **test case** references existing variables, grades, and
        reason codes, and its input passes or fails the data dictionary as its expected outcome
        says. Paths are those of the editing endpoints, prefixed `scorecard.` and
        `decision_matrix.` for those sections.

        **Golden tests (RF-013).** When no other check found a problem, every test case is
        executed with the same code a decision uses: input validation, derived features (DSR and
        net disposable income), RAC rules, scorecard, decision matrix, and precedence. The
        result of each case is in `golden_tests.results` with the `actual` outcome and what
        differs from the expectation (`mismatches`). The decision and the reason codes must
        match (reason codes as a set: a case that lists none expects none), the grade only when
        the case names one, and a case that expects `INPUT_VALIDATION_ERROR` must be refused.
        A technical failure (`EVALUATION_ERROR`, `POLICY_CONFIGURATION_ERROR`) is never a pass.
        A mismatch of a **required** case is an issue and makes `valid` false; a mismatch of an
        optional case is reported but does not. If another check failed the cases are not run,
        and `pending_checks` says so: a skipped check is always listed so it is never mistaken
        for a pass. `pending_checks` is empty when everything ran.
      operationId: validatePolicyVersion
      x-required-permission: policy:submit
      responses:
        "200":
          description: The validation report.
          headers:
            X-Request-ID: { $ref: "#/components/headers/XRequestID" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ValidationReport" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/PolicyVersionNotFound" }
        "408": { $ref: "#/components/responses/RequestTimeout" }
        "500": { $ref: "#/components/responses/InternalError" }
  /api/v1/decisions/evaluate:
    post:
      tags: [Decisions]
      summary: Evaluate a loan application
      description: |
        Runs a credit decision for one application against the **active policy** of its product
        (SYSTEM_DESIGN.md 10, 13.2 to 13.4). The active version is resolved once at the start of
        the request, so a publish during the request cannot change the version it uses, and the
        response names that version (`policy_version`).

        Pipeline: the applicant data is validated and normalized against the data dictionary the
        policy was written for; the derived features are built (`dsr_ratio` and
        `net_disposable_income`, exact, with the formula version); the RAC rules run in order;
        unless a hard rule rejected the application, the scorecard selects one bin per
        characteristic and adds its points, the decision matrix maps the total to a grade and a
        decision, and the precedence hard RAC `REJECT` > matrix `REJECT` > soft RAC `REFER` >
        matrix `APPROVE`/`REFER` gives `final_decision`.

        **Applicant data.** Integers are JSON numbers, decimals (money, ratios) are **strings**
        such as `"12000000.00"`; a JSON number for money is refused (`invalid_type`) instead of
        being rounded. A missing or `null` required value, a wrong type, a value outside the
        dictionary range, too many decimals, a key that is not a dictionary variable
        (`unknown_variable`), and a derived value sent by the caller (`derived_not_allowed`) are
        all `422 INPUT_VALIDATION_ERROR`, listed together with paths such as
        `applicant.monthly_income`. Invalid data is an error, never a `REJECT`.

        **Errors are not decisions.** `409 POLICY_NOT_ACTIVE` when the product is retired or has
        no active policy (a draft or a pending version is never evaluated); `404
        PRODUCT_NOT_FOUND`; `500 POLICY_CONFIGURATION_ERROR` when the active policy cannot be
        evaluated; `500 EVALUATION_ERROR` for a technical failure while evaluating. None of them
        carries a decision, and the cause is logged server-side only.

        **Not stored yet.** The decision is not persisted and has no `decision_id`, and the
        `Idempotency-Key` header is not read: persistence and idempotency arrive with RF-015
        (`GET /decisions/{decision_id}` too). Meanwhile the same request gives the same response
        as long as the same version is active. Any `API_CONSUMER` may evaluate any product;
        per-product authorization needs API clients, which do not exist yet.
      operationId: evaluateDecision
      x-required-permission: decision:evaluate
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DecisionRequest" }
            example:
              application_id: LOAN-APP-DEMO-0001
              product_code: KTA_DEMO
              applicant:
                age_years: 29
                monthly_income: "12000000.00"
                existing_installment: "2500000.00"
                employment_tenure_months: 36
                slik_max_kol: 1
                is_blacklisted: false
      responses:
        "200":
          description: The policy was evaluated and gave a business decision (`APPROVE`, `REFER`, or `REJECT`).
          headers:
            X-Request-ID: { $ref: "#/components/headers/XRequestID" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DecisionResult" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: The product code is unknown.
          headers:
            X-Request-ID: { $ref: "#/components/headers/XRequestID" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example:
                error: { code: PRODUCT_NOT_FOUND, message: product not found }
                request_id: 7a6b5c4d3e2f1a0b9c8d7e6f5a4b3c2d
        "408": { $ref: "#/components/responses/RequestTimeout" }
        "409":
          description: The product is retired or has no active policy version.
          headers:
            X-Request-ID: { $ref: "#/components/headers/XRequestID" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example:
                error: { code: POLICY_NOT_ACTIVE, message: the product has no active policy }
                request_id: 8b7c6d5e4f3a2b1c0d9e8f7a6b5c4d3e
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "422":
          description: The request or the applicant data is invalid. Never a rejection of the application.
          headers:
            X-Request-ID: { $ref: "#/components/headers/XRequestID" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example:
                error:
                  code: INPUT_VALIDATION_ERROR
                  message: the application data is invalid
                  details:
                    - { field: applicant.monthly_income, issue: below_min_value }
                request_id: 9c8d7e6f5a4b3c2d1e0f9a8b7c6d5e4f
        "500":
          description: |
            A technical failure. `INTERNAL_ERROR`, `POLICY_CONFIGURATION_ERROR` (the active policy
            cannot be evaluated), or `EVALUATION_ERROR` (a failure while evaluating). No decision
            was made, and in particular the application was not rejected.
          headers:
            X-Request-ID: { $ref: "#/components/headers/XRequestID" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example:
                error: { code: EVALUATION_ERROR, message: "the application could not be evaluated; no decision was made" }
                request_id: 0d9e8f7a6b5c4d3e2f1a0b9c8d7e6f5a
security:
  - bearerAuth: []

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  headers:
    XRequestID:
      description: Correlation ID. A client value matching `^[A-Za-z0-9._-]{8,64}$` is echoed; otherwise one is generated.
      schema: { type: string }

  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [ok, unavailable] }

    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 64
          description: Stored usernames match `^[A-Za-z0-9._-]{3,64}$`; anything else is rejected as invalid credentials.
        password:
          type: string
          minLength: 1
          format: password
          description: At most 72 bytes when UTF-8 encoded (the bcrypt input limit). Longer values are a 422.

    TokenResponse:
      type: object
      required: [access_token, token_type, expires_in]
      properties:
        access_token: { type: string }
        token_type: { type: string, const: Bearer }
        expires_in: { type: integer, minimum: 60, maximum: 86400, description: "Lifetime in seconds (JWT_TTL: 1 to 1440 minutes)." }

    Me:
      type: object
      required: [user_id, username, roles, permissions]
      properties:
        user_id: { type: string, format: uuid }
        username: { type: string }
        roles:
          type: array
          items: { type: string, enum: [ADMIN, RISK_ANALYST, RISK_APPROVER, AUDITOR, API_CONSUMER] }
        permissions:
          type: array
          items: { type: string }

    ProductCode:
      type: string
      pattern: "^[A-Z][A-Z0-9_]{2,31}$"
      example: KTA_DEMO

    ProductStatus:
      type: string
      enum: [ACTIVE, INACTIVE]
      example: ACTIVE

    Product:
      type: object
      required: [id, code, name, description, status, created_at, updated_at]
      example:
        id: 7d3f0c2e-4b1a-4a8e-9f3d-2c1b0a9e8d7f
        code: KTA_DEMO
        name: Kredit Tanpa Agunan (Demo)
        description: Synthetic unsecured personal loan product for the RiskForge demo.
        status: ACTIVE
        created_at: "2026-11-17T08:00:00Z"
        updated_at: "2026-11-17T08:00:00Z"
      properties:
        id: { type: string, format: uuid }
        code: { $ref: "#/components/schemas/ProductCode" }
        name: { type: string, minLength: 1, maxLength: 100 }
        description: { type: string, maxLength: 500 }
        status: { $ref: "#/components/schemas/ProductStatus" }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    ProductCreate:
      type: object
      additionalProperties: false
      required: [code, name]
      properties:
        code: { $ref: "#/components/schemas/ProductCode" }
        name:
          type: string
          minLength: 1
          maxLength: 100
          description: Leading and trailing whitespace is trimmed. Control characters are rejected.
        description:
          type: string
          maxLength: 500
          description: Tab and line breaks are allowed; other control characters (including NUL) are rejected.
        status: { $ref: "#/components/schemas/ProductStatus", default: ACTIVE }

    ProductUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        description: { type: string, maxLength: 500 }
        status: { $ref: "#/components/schemas/ProductStatus" }

    ProductList:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/Product" }
        meta: { $ref: "#/components/schemas/PageMeta" }

    PageMeta:
      type: object
      required: [page, per_page, total]
      properties:
        page: { type: integer, minimum: 1, maximum: 10000 }
        per_page: { type: integer, minimum: 1, maximum: 100 }
        total: { type: integer, minimum: 0 }

    VariableCode:
      type: string
      pattern: "^[a-z][a-z0-9_]{2,63}$"
      example: monthly_income
    VariableOrigin:
      type: string
      enum: [INPUT, DERIVED]
      description: INPUT is supplied by the Loan Application; DERIVED is computed by the feature builder.
      example: INPUT
    VariableType:
      type: string
      enum: [INTEGER, DECIMAL, BOOLEAN]
      description: On the wire INTEGER is a JSON number, DECIMAL is a decimal string, BOOLEAN is a JSON boolean.
      example: DECIMAL
    DecimalBound:
      type: [string, "null"]
      pattern: "^-?(0|[1-9][0-9]{0,17})(\\.[0-9]+)?$"
      description: |
        Inclusive bound as a decimal string (at most 18 integer digits, no exponent). For INTEGER
        it must have no fraction. For DECIMAL it must fit `scale`. The response shows it with
        exactly `scale` fraction digits. Not allowed for BOOLEAN.
      example: "0.01"
    Variable:
      type: object
      required: [id, code, origin, type, description, unit, required, nullable, scale, min_value, max_value, version, schema_version, created_at, updated_at]
      example:
        id: 0b9f1d4e-6a2c-4c8e-8d3a-5e7f9a1b2c3d
        code: monthly_income
        origin: INPUT
        type: DECIMAL
        description: Verified (synthetic) monthly income. Must be positive.
        unit: IDR
        required: true
        nullable: false
        scale: 2
        min_value: "0.01"
        max_value: "1000000000000.00"
        version: 1
        schema_version: 2
        created_at: "2026-11-20T08:00:00Z"
        updated_at: "2026-11-20T08:00:00Z"
      properties:
        id: { type: string, format: uuid }
        code: { $ref: "#/components/schemas/VariableCode" }
        origin: { $ref: "#/components/schemas/VariableOrigin" }
        type: { $ref: "#/components/schemas/VariableType" }
        description: { type: string, minLength: 1, maxLength: 500 }
        unit: { type: string, maxLength: 20, description: Empty when the variable has no unit. }
        required:
          type: boolean
          description: The input must be present and non-null. A missing key and an explicit null are both an input validation error, never a REJECT. Always false for DERIVED.
        nullable:
          type: boolean
          description: An explicit null is an acceptable value. Never true together with `required`.
        scale:
          type: [integer, "null"]
          minimum: 0
          maximum: 8
          description: Maximum fraction digits of a DECIMAL (display rounding scale for DERIVED). Null for other types.
        min_value: { $ref: "#/components/schemas/DecimalBound" }
        max_value: { $ref: "#/components/schemas/DecimalBound" }
        version: { type: integer, minimum: 1, description: Version of this variable's definition. }
        schema_version: { type: integer, minimum: 1, description: Dictionary schema version that introduced this version. }
        created_at: { type: string, format: date-time, description: When version 1 was created. }
        updated_at: { type: string, format: date-time, description: When this version was created. }
    VariableCreate:
      type: object
      additionalProperties: false
      required: [code, type, description]
      properties:
        code: { $ref: "#/components/schemas/VariableCode" }
        origin: { $ref: "#/components/schemas/VariableOrigin", default: INPUT }
        type: { $ref: "#/components/schemas/VariableType" }
        description:
          type: string
          minLength: 1
          maxLength: 500
          description: Leading and trailing whitespace is trimmed. Line breaks are allowed; other control characters (including NUL) are rejected.
        unit: { type: string, maxLength: 20, description: "Single line, for example IDR, years, months, ratio." }
        required: { type: boolean, description: "Default true for INPUT. DERIVED variables cannot be required." }
        nullable: { type: boolean, default: false, description: Cannot be true when `required` is true. }
        scale: { type: integer, minimum: 0, maximum: 8, description: "DECIMAL only; default 2." }
        min_value: { $ref: "#/components/schemas/DecimalBound" }
        max_value: { $ref: "#/components/schemas/DecimalBound" }
    VariableUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        description: { type: string, minLength: 1, maxLength: 500 }
        unit: { type: string, maxLength: 20 }
        required: { type: boolean }
        nullable: { type: boolean }
        scale: { type: integer, minimum: 0, maximum: 8, description: DECIMAL only. Refused when an existing bound would need more fraction digits. }
        min_value: { $ref: "#/components/schemas/DecimalBound" }
        max_value: { $ref: "#/components/schemas/DecimalBound" }
    VariableList:
      type: object
      required: [data, meta]
      example:
        data:
          - id: 0b9f1d4e-6a2c-4c8e-8d3a-5e7f9a1b2c3d
            code: monthly_income
            origin: INPUT
            type: DECIMAL
            description: Verified (synthetic) monthly income. Must be positive.
            unit: IDR
            required: true
            nullable: false
            scale: 2
            min_value: "0.01"
            max_value: "1000000000000.00"
            version: 1
            schema_version: 2
            created_at: "2026-11-20T08:00:00Z"
            updated_at: "2026-11-20T08:00:00Z"
        meta: { page: 1, per_page: 20, total: 1, schema_version: 8 }
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/Variable" }
        meta:
          type: object
          required: [page, per_page, total, schema_version]
          properties:
            page: { type: integer, minimum: 1, maximum: 10000 }
            per_page: { type: integer, minimum: 1, maximum: 100 }
            total: { type: integer, minimum: 0 }
            schema_version: { type: integer, minimum: 0, description: The dictionary schema version this page was read at. }
    PolicyId:
      type: string
      format: uuid
      example: 3f6c1c52-0d0b-4f0e-9a52-6b0f6a1c7d11
    PolicyVersionId:
      type: string
      format: uuid
      example: 9a8b7c6d-5e4f-4a3b-8c2d-1e0f9a8b7c6d
    PolicyScope:
      type: string
      pattern: "^[A-Z][A-Z0-9_]{1,31}$"
      example: DEFAULT
    PolicyStatus:
      type: string
      enum: [DRAFT, PENDING_APPROVAL, REJECTED, APPROVED, ACTIVE, ARCHIVED]
      description: |
        Lifecycle of SYSTEM_DESIGN.md 9.2. Only DRAFT can change. Submit moves DRAFT to
        PENDING_APPROVAL; the later transitions are implemented in M4.
      example: DRAFT
    PolicyVersionSummary:
      type: object
      required: [id, policy_id, product_code, scope, version_number, status, description, based_on_version_id, dictionary_schema_version, checksum, submitted_by, submitted_at, created_by, created_at, updated_at]
      example:
        id: 9a8b7c6d-5e4f-4a3b-8c2d-1e0f9a8b7c6d
        policy_id: 3f6c1c52-0d0b-4f0e-9a52-6b0f6a1c7d11
        product_code: KTA_DEMO
        scope: DEFAULT
        version_number: 1
        status: DRAFT
        description: Initial draft of the KTA_DEMO policy.
        based_on_version_id: null
        dictionary_schema_version: 8
        checksum: null
        submitted_by: null
        submitted_at: null
        created_by: 2e4ebb31-3fbc-480f-a602-302b6766efa1
        created_at: "2026-11-21T08:00:00Z"
        updated_at: "2026-11-21T08:00:00Z"
      properties:
        id: { $ref: "#/components/schemas/PolicyVersionId" }
        policy_id: { $ref: "#/components/schemas/PolicyId" }
        product_code: { $ref: "#/components/schemas/ProductCode" }
        scope: { $ref: "#/components/schemas/PolicyScope" }
        version_number: { type: integer, minimum: 1, description: "Numbered per policy, starting at 1." }
        status: { $ref: "#/components/schemas/PolicyStatus" }
        description: { type: string, maxLength: 500, description: Change note. }
        based_on_version_id:
          oneOf: [{ $ref: "#/components/schemas/PolicyVersionId" }, { type: "null" }]
          description: The version this draft was cloned from; null for the first draft.
        dictionary_schema_version: { type: integer, minimum: 0, description: The data dictionary schema version the version is written against. }
        checksum:
          type: [string, "null"]
          pattern: "^[0-9a-f]{64}$"
          description: SHA-256 of the canonical snapshot; null until submitted.
        submitted_by:
          oneOf: [{ type: string, format: uuid }, { type: "null" }]
        submitted_at: { type: [string, "null"], format: date-time }
        created_by:
          oneOf: [{ type: string, format: uuid }, { type: "null" }]
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    PolicySnapshot:
      type: object
      description: |
        Frozen content of a submitted version in canonical form (keys sorted, no whitespace
        outside strings). `checksum` is the SHA-256 of exactly this form.
        `rac_rules` lists the RAC rules in evaluation order (RF-007), `scorecard` is the scorecard
        without the derived `score_range` or null (RF-008), `decision_matrix` lists the matrix rows in ascending order, or is empty (RF-009),
        and `test_cases` lists the test cases in order (RF-010). `format` is 2 since RF-010
        (snapshots taken by RF-006 to RF-009 are format 1, are returned as stored, and have no
        `test_cases`; a stored snapshot is never rewritten because its checksum covers it).
      required: [format, evaluator_version, package, version_number, dictionary, rac_rules, scorecard, decision_matrix]
      example:
        format: 2
        evaluator_version: "1"
        package: { product_code: KTA_DEMO, scope: DEFAULT }
        version_number: 1
        dictionary:
          schema_version: 8
          variables:
            - code: age_years
              origin: INPUT
              type: INTEGER
              description: Applicant age on the application date.
              unit: years
              required: true
              nullable: false
              scale: null
              min_value: "0"
              max_value: "120"
              version: 1
              schema_version: 1
        rac_rules: []
        scorecard: null
        decision_matrix: []
        test_cases: []
      properties:
        format: { type: integer }
        evaluator_version: { type: string }
        package:
          type: object
          properties:
            product_code: { type: string }
            scope: { type: string }
        version_number: { type: integer }
        dictionary:
          type: object
          properties:
            schema_version: { type: integer }
            variables: { type: array, items: { type: object } }
        rac_rules: { type: array, items: { type: object } }
        scorecard: { type: [object, "null"] }
        decision_matrix: { type: array, items: { type: object } }
        test_cases: { type: array, items: { type: object } }
    PolicyVersion:
      allOf:
        - $ref: "#/components/schemas/PolicyVersionSummary"
        - type: object
          required: [snapshot]
          properties:
            snapshot:
              oneOf: [{ $ref: "#/components/schemas/PolicySnapshot" }, { type: "null" }]
              description: Null while the version is a DRAFT.
      example:
        id: 9a8b7c6d-5e4f-4a3b-8c2d-1e0f9a8b7c6d
        policy_id: 3f6c1c52-0d0b-4f0e-9a52-6b0f6a1c7d11
        product_code: KTA_DEMO
        scope: DEFAULT
        version_number: 1
        status: PENDING_APPROVAL
        description: Initial draft of the KTA_DEMO policy.
        based_on_version_id: null
        dictionary_schema_version: 8
        checksum: 5d41402abc4b2a76b9719d911017c5925d41402abc4b2a76b9719d911017c592
        submitted_by: 2e4ebb31-3fbc-480f-a602-302b6766efa1
        submitted_at: "2026-11-21T08:05:00Z"
        created_by: 2e4ebb31-3fbc-480f-a602-302b6766efa1
        created_at: "2026-11-21T08:00:00Z"
        updated_at: "2026-11-21T08:05:00Z"
        snapshot:
          dictionary:
            schema_version: 8
            variables: []
          decision_matrix: []
          evaluator_version: "1"
          format: 2
          package: { product_code: KTA_DEMO, scope: DEFAULT }
          rac_rules: []
          scorecard: null
          test_cases: []
          version_number: 1
    PolicyCreate:
      type: object
      additionalProperties: false
      required: [product_code]
      properties:
        product_code: { type: string, minLength: 1, maxLength: 32, example: KTA_DEMO, description: An existing ACTIVE product. }
        scope: { $ref: "#/components/schemas/PolicyScope", default: DEFAULT }
        description: { type: string, maxLength: 500, description: Change note of the first draft. }
    PolicyClone:
      type: object
      additionalProperties: false
      properties:
        source_version_id: { $ref: "#/components/schemas/PolicyVersionId" }
        description: { type: string, maxLength: 500, description: Change note; inherited from the source when omitted. }
    PolicyVersionUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        description: { type: string, maxLength: 500 }
