                required: [case_code, required, base, target, changed]
                properties:
                  case_code: { type: string }
                  required: { type: boolean }
                  base:
                    oneOf: [{ $ref: "#/components/schemas/CaseOutcome" }, { type: "null" }]
                  target: { $ref: "#/components/schemas/CaseOutcome" }
                  changed: { type: boolean }
