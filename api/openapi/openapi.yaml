              origin: INPUT
              type: INTEGER
              description: Applicant age on the application date.
              unit: years
              required: true
              nullable: false
              scale: null
              min_value: "0"
              max_value: "120"
              version: 1
              schema_version: 1
        rac_rules: []
        scorecard: null
        decision_matrix: []
        test_cases: []
