          base: { id: 3f6c1c52-0d0b-4f0e-9a52-6b0f6a1c7d11, version_number: 1, status: ACTIVE, checksum: 5d41402abc4b2a76b9719d911017c5925d41402abc4b2a76b9719d911017c592 }
          base_reason: ACTIVE_VERSION
          changed: true
          summary:
            rac_rules: { added: 0, removed: 0, modified: 1 }
