      properties:
        id: { $ref: "#/components/schemas/PolicyId" }
        product_code: { $ref: "#/components/schemas/ProductCode" }
        scope: { $ref: "#/components/schemas/PolicyScope" }
        version_count: { type: integer, minimum: 0 }
        latest_version:
          oneOf: [{ $ref: "#/components/schemas/PolicyVersionSummary" }, { type: "null" }]
        created_at: { type: string, format: date-time }
    PolicyList:
      type: object
      required: [data, meta]
      example:
        data:
          - id: 3f6c1c52-0d0b-4f0e-9a52-6b0f6a1c7d11
            product_code: KTA_DEMO
            scope: DEFAULT
            version_count: 1
            created_at: "2026-11-21T08:00:00Z"
            latest_version:
              id: 9a8b7c6d-5e4f-4a3b-8c2d-1e0f9a8b7c6d
              policy_id: 3f6c1c52-0d0b-4f0e-9a52-6b0f6a1c7d11
              product_code: KTA_DEMO
              scope: DEFAULT
              version_number: 1
              status: DRAFT
              description: Initial draft of the KTA_DEMO policy.
              based_on_version_id: null
              dictionary_schema_version: 8
              checksum: null
              submitted_by: null
              submitted_at: null
              created_by: 2e4ebb31-3fbc-480f-a602-302b6766efa1
              created_at: "2026-11-21T08:00:00Z"
              updated_at: "2026-11-21T08:00:00Z"
        meta: { page: 1, per_page: 20, total: 1 }
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/PolicyListItem" }
        meta: { $ref: "#/components/schemas/PageMeta" }
    RacRuleCode:
      type: string
      pattern: "^[A-Z][A-Z0-9_]{2,63}$"
      example: RAC_MIN_AGE
    RacAction:
      type: string
      enum: [REJECT, REFER]
      description: What a failed rule does. REJECT is a hard fail that ends the evaluation; REFER is a soft fail that flags manual review and lets scoring continue.
      example: REJECT
    RacRuleInput:
      type: object
      additionalProperties: false
      required: [rule_code, reason_code, action, expression]
      properties:
        rule_code: { $ref: "#/components/schemas/RacRuleCode", description: Unique within the version. }
        reason_code:
          type: string
          pattern: "^[A-Z][A-Z0-9_]{2,63}$"
          example: AGE_BELOW_MINIMUM
          description: Stable machine-readable explanation returned when the rule fails. Required for every rule. Rules may share one.
        action: { $ref: "#/components/schemas/RacAction" }
        expression:
          type: string
          minLength: 1
          maxLength: 500
          example: age_years >= 21
          description: The condition that must hold to pass the rule. One line, boolean, over data dictionary variables.
        description: { type: string, maxLength: 200, description: Optional note for reviewers. }
    RacRulesReplace:
      type: object
      additionalProperties: false
      required: [rules]
      properties:
        rules:
          type: array
          maxItems: 100
          items: { $ref: "#/components/schemas/RacRuleInput" }
    RacRule:
      type: object
      required: [order, rule_code, reason_code, expression, action, description]
      example: { order: 1, rule_code: RAC_MIN_AGE, reason_code: AGE_BELOW_MINIMUM, expression: "age_years >= 21", action: REJECT, description: Applicant must be at least 21 years old. }
      properties:
        order: { type: integer, minimum: 1, description: Evaluation order; unique within the version. }
        rule_code: { $ref: "#/components/schemas/RacRuleCode" }
        reason_code: { type: string, pattern: "^[A-Z][A-Z0-9_]{2,63}$" }
        expression: { type: string, maxLength: 500 }
        action: { $ref: "#/components/schemas/RacAction" }
        description: { type: string, maxLength: 200 }
    RacRuleSet:
      type: object
      required: [policy_version_id, status, dictionary_schema_version, rules, updated_at]
      example:
        policy_version_id: 9a8b7c6d-5e4f-4a3b-8c2d-1e0f9a8b7c6d
        status: DRAFT
        dictionary_schema_version: 8
        updated_at: "2026-11-22T08:00:00Z"
        rules:
          - { order: 1, rule_code: RAC_MIN_AGE, reason_code: AGE_BELOW_MINIMUM, expression: "age_years >= 21", action: REJECT, description: Applicant must be at least 21 years old. }
          - { order: 2, rule_code: RAC_BLACKLIST, reason_code: BLACKLISTED, expression: "is_blacklisted == false", action: REJECT, description: Blacklisted applicants are rejected. }
          - { order: 3, rule_code: RAC_SLIK, reason_code: SLIK_REVIEW_REQUIRED, expression: "slik_max_kol <= 2", action: REFER, description: Worse collectability goes to manual review. }
      properties:
        policy_version_id: { $ref: "#/components/schemas/PolicyVersionId" }
        status: { $ref: "#/components/schemas/PolicyStatus" }
        dictionary_schema_version: { type: integer, minimum: 0, description: The dictionary version the expressions are checked against. }
        updated_at: { type: string, format: date-time }
        rules:
          type: array
          items: { $ref: "#/components/schemas/RacRule" }
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              enum:
                - UNAUTHENTICATED
                - INVALID_CREDENTIALS
                - FORBIDDEN
                - INPUT_VALIDATION_ERROR
                - ROUTE_NOT_FOUND
                - PRODUCT_NOT_FOUND
                - PRODUCT_CODE_CONFLICT
                - VARIABLE_NOT_FOUND
                - VARIABLE_CODE_CONFLICT
                - POLICY_NOT_FOUND
                - POLICY_VERSION_NOT_FOUND
                - POLICY_CONFLICT
                - POLICY_VERSION_FROZEN
                - POLICY_VALIDATION_FAILED
                - SERVICE_BUSY
                - INTERNAL_ERROR
            message: { type: string }
            details:
              type: array
              items:
                type: object
                required: [field, issue]
                properties:
                  field: { type: string }
                  issue:
                    type: string
                    description: Stable issue code, e.g. required, too_long, invalid_format, invalid_value, invalid_characters, must_be_string, must_be_boolean, must_be_integer, not_allowed, no_changes, exceeds_scale, less_than_min_value, not_allowed_for_type, not_allowed_when_required, must_be_false_for_derived, exceeds_current_version, unknown_product, product_inactive, not_in_policy, must_be_a_non_negative_integer, must_be_array, must_be_object, too_many, duplicate, syntax_error, unsupported_syntax, unknown_variable, type_error.
                  message:
                    type: string
                    description: Explanation in words for issues that need one, for example the position of a syntax error. Absent for most details.
        request_id: { type: string }

  responses:
    Unauthenticated:
      description: Missing, malformed, tampered, or expired token, or the user is disabled.
      headers:
        X-Request-ID: { $ref: "#/components/headers/XRequestID" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
          example:
            error: { code: UNAUTHENTICATED, message: authentication is required }
            request_id: ab37401e16e0bcc7ddf3f61598024191
    Forbidden:
      description: The caller lacks the required permission.
      headers:
        X-Request-ID: { $ref: "#/components/headers/XRequestID" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
          example:
            error: { code: FORBIDDEN, message: you do not have permission to perform this action }
            request_id: 0f9e8d7c6b5a49382716051f2e3d4c5b
    ValidationError:
      description: The request is well-formed HTTP but semantically invalid.
      headers:
        X-Request-ID: { $ref: "#/components/headers/XRequestID" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
          example:
            error:
              code: INPUT_VALIDATION_ERROR
              message: invalid product
              details:
                - { field: code, issue: invalid_format }
                - { field: name, issue: required }
            request_id: 1a2b3c4d5e6f7a8b9c0d1e2f3a4b5c6d
    ProductNotFound:
      description: No product has this code.
      headers:
        X-Request-ID: { $ref: "#/components/headers/XRequestID" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
          example:
            error: { code: PRODUCT_NOT_FOUND, message: product not found }
            request_id: 9c8b7a6f5e4d3c2b1a0f9e8d7c6b5a49
    VariableNotFound:
      description: No variable has this code.
      headers:
        X-Request-ID: { $ref: "#/components/headers/XRequestID" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
          example:
            error: { code: VARIABLE_NOT_FOUND, message: variable not found }
            request_id: 7a6b5c4d3e2f1a0b9c8d7e6f5a4b3c2d
    PolicyNotFound:
      description: No policy has this id.
      headers:
        X-Request-ID: { $ref: "#/components/headers/XRequestID" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
          example:
            error: { code: POLICY_NOT_FOUND, message: policy not found }
            request_id: 8b7a6c5d4e3f2a1b0c9d8e7f6a5b4c3d
    PolicyVersionNotFound:
      description: No policy version has this id.
      headers:
        X-Request-ID: { $ref: "#/components/headers/XRequestID" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
          example:
            error: { code: POLICY_VERSION_NOT_FOUND, message: policy version not found }
            request_id: 9c8b7a6d5e4f3a2b1c0d9e8f7a6b5c4d
    PolicyVersionFrozen:
      description: The version is not a DRAFT, so it can no longer be edited or submitted.
      headers:
        X-Request-ID: { $ref: "#/components/headers/XRequestID" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
          example:
            error: { code: POLICY_VERSION_FROZEN, message: only a DRAFT version can be changed or submitted }
            request_id: 0d9c8b7a6e5f4a3b2c1d0e9f8a7b6c5d
    PolicyInvalid:
      description: |
        The draft cannot be submitted because its content does not validate, for example a RAC
        expression that no longer compiles against the dictionary version the draft is pinned to.
        The details use the paths of the editing endpoints. The draft stays a DRAFT.
      headers:
        X-Request-ID: { $ref: "#/components/headers/XRequestID" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
          example:
            error:
              code: POLICY_VALIDATION_FAILED
              message: the draft cannot be submitted until its content is valid
              details:
                - { field: "rules[1].expression", issue: unknown_variable, message: "unknown variable \"is_blacklisted\"" }
            request_id: 3c2b1a0d9e8f7a6b5c4d3e2f1a0b9c8d
    InternalError:
      description: Unexpected failure. The cause is logged server-side and never returned.
      headers:
        X-Request-ID: { $ref: "#/components/headers/XRequestID" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
          example:
            error: { code: INTERNAL_ERROR, message: an unexpected error occurred }
            request_id: 5e4d3c2b1a0f9e8d7c6b5a493827160f
    ServiceBusy:
      description: Password hashing capacity is saturated. Retry after the given number of seconds.
      headers:
        X-Request-ID: { $ref: "#/components/headers/XRequestID" }
        Retry-After:
          schema: { type: integer }
          example: 1
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
          example:
            error: { code: SERVICE_BUSY, message: "the service is busy, retry shortly" }
            request_id: 6f5e4d3c2b1a0f9e8d7c6b5a49382716
    RequestTimeout:
      description: The request exceeded the 3 second limit. Produced by the HTTP driver; plain-text body.
      content:
        text/plain:
          schema: { type: string }
          example: Request Timeout
    PayloadTooLarge:
      description: The request body exceeds 64 KiB. Produced by the HTTP driver; plain-text body.
      content:
        text/plain:
          schema: { type: string }
          example: Request Entity Too Large
